  function renderAnnouncementsList(items, tool, roleLabel, canManage) {
    const el = document.getElementById('an-list-card');
    if (!items.length) {
      el.innerHTML = '<div class="empty">Καμία ενημέρωση ακόμα</div>';
      return;
    }
    el.innerHTML = items.map(a => {
      const teams = a.TargetTeams || ['ALL'];
      const targetLabel = teams.includes('ALL') ? '' : ` · Στοχευμένο: ${teams.join(', ')}`;
      return `
      <div class="an-item" data-id="${a.ID}">
        <div class="an-item-head">
          <div>
            <div class="an-item-title">${escapeHtml(a.Title)}</div>
            <div class="an-item-meta">${escapeHtml(a.PostedByName) || '—'} · ${fmtDateTime(a.PostedAt)}${targetLabel}</div>
          </div>
          ${canManage ? `<button class="icon-btn danger" data-action="delete" data-id="${a.ID}">Διαγραφή</button>` : ''}
        </div>
        ${a.Body ? `<div class="an-item-body">${escapeHtml(a.Body)}</div>` : ''}
        ${a.HasFile ? `<a class="an-item-file" href="/api/announcements/file?id=${encodeURIComponent(a.ID)}" target="_blank" rel="noopener">📎 ${a.FileName || 'Συνημμένο'}</a>` : ''}
      </div>
    `;
    }).join('');

    if (canManage) {
      el.querySelectorAll('button[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteAnnouncement(btn.dataset.id, tool, roleLabel));
      });
    }
  }

  async function addAnnouncement(tool, roleLabel) {
    const title = document.getElementById('an-title').value.trim();
    const body = document.getElementById('an-body').value.trim();
    const fileInput = document.getElementById('an-file');
    const file = fileInput.files && fileInput.files[0];
    const allChecked = document.querySelector('.an-team-all').checked;
    const targetTeams = allChecked
      ? ['ALL']
      : Array.from(document.querySelectorAll('.an-team-cb:checked')).map(cb => cb.value);
    const msg = document.getElementById('an-add-msg');
    const btn = document.getElementById('an-add-btn');

    if (!title) { msg.textContent = 'Χρειάζεται τίτλος.'; msg.className = 'msg err'; return; }
    if (!allChecked && !targetTeams.length) { msg.textContent = 'Επίλεξε «Όλοι» ή τουλάχιστον μία ειδικότητα.'; msg.className = 'msg err'; return; }
    if (file && !ANNOUNCEMENT_FILE_TYPES[file.type]) {
      msg.textContent = 'Επιτρέπονται μόνο PDF και Word αρχεία.';
      msg.className = 'msg err';
      return;
    }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      let fileKey = '', fileName = '', fileType = '';
      if (file) {
        const upRes = await fetch('/api/announcements/upload?filename=' + encodeURIComponent(file.name), {
          method: 'POST',
          headers: { 'Content-Type': file.type },
          body: file,
        });
        const upData = await upRes.json();
        if (!upRes.ok) throw new Error(upData.error || 'Αποτυχία ανεβάσματος αρχείου.');
        fileKey = upData.fileKey; fileName = upData.fileName; fileType = upData.contentType;
      }

      const res = await fetch('/api/announcements', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body, fileKey, fileName, fileType, targetTeams }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία δημοσίευσης.');
      renderAnnouncements(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  async function deleteAnnouncement(id, tool, roleLabel) {
    if (!confirm('Διαγραφή αυτής της ενημέρωσης;')) return;
    try {
      const res = await fetch('/api/announcements/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία διαγραφής.');
      renderAnnouncements(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

  // ============================================================
  // «ΑΝΑΚΟΙΝΩΣΕΙΣ» — ερωτήματα διαθεσιμότητας επαρχίας (item #7, 13/08/2026).
  // Τεχνικός: βλέπει μόνο ερωτήματα της δικής του ειδικότητας, απαντάει
  // Ναι/Όχι μέχρι την προθεσμία (μπορεί να αλλάξει γνώμη μέχρι τότε).
  // TL/Director: δημιουργεί (πολλαπλή επιλογή ειδικοτήτων-στόχων, ίδια
  // λίστα με το πεδίο Team του Νέος Τεχνικός) + βλέπει ΟΛΑ τα ερωτήματα
  // όλων των TL με συγκεντρωτικές απαντήσεις + διαγράφει οποιοδήποτε.
  // ============================================================
  async function renderAvailabilityQueries(tool, roleLabel) {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.innerHTML = loadingBarHtml('Φόρτωση...');

    const isTechnician = CURRENT_WHO.role === 'technician';

    try {
      if (isTechnician) {
        const res = await fetch('/api/availability/my-queries');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Σφάλμα φόρτωσης.');
        renderAvailabilityQueriesTechnician(data.queries || [], tool, roleLabel);
      } else {
        const res = await fetch('/api/availability/queries');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Σφάλμα φόρτωσης.');
        renderAvailabilityQueriesLeader(data.queries || [], data.teamOptions || [], tool, roleLabel);
      }
    } catch (err) {
      content.className = 'err';
      content.textContent = 'Σφάλμα: ' + (err.message || err);
    }
  }

  /** «Έλαβα γνώση» (ACK) / «καθαρά ενημερωτικό, χωρίς απάντηση» (NONE) vs
   * Ναι/Όχι — reused σε τεχνικό (this fn), TL/Director αναλυτικά
   * (avqLeaderItem) και Προφίλ Τεχνικού. */
  function avqIsAck(q) { return q.ResponseMode === 'ACK'; }
  function avqIsNone(q) { return q.ResponseMode === 'NONE'; }

  function avqTechnicianItem(q) {
    const isAck = avqIsAck(q);
    const isNone = avqIsNone(q);
    const badge = q.Active ? '<span class="status-pill st-ok">Ενεργό</span>' : '<span class="status-pill st-bad">Έληξε</span>';
    const answered = q.MyAnswer;
    const deadlineLabel = (isAck || isNone) ? 'Ενημερωτικό' : (q.Deadline ? `Προθεσμία ${fmtDate(q.Deadline)}` : 'Χωρίς λήξη');
    let bodyHtml;
    if (isNone) {
      // Καμία δυνατότητα απάντησης — κανένα κουμπί, καμία ένδειξη «απάντησης».
      bodyHtml = '';
    } else if (isAck) {
      bodyHtml = q.Active
        ? (answered
            ? `<div class="an-item-meta" style="margin-top:8px;">✓ Το είδες</div>`
            : `<div class="avq-answer-btns"><button class="btn btn-yes" data-ack="1" data-id="${q.ID}">👁 Έλαβα γνώση</button></div>`)
        : `<div class="an-item-meta" style="margin-top:8px;">${answered ? '✓ Το είδες' : '— δεν το είδες —'}</div>`;
    } else {
      bodyHtml = q.Active
        ? `<div class="avq-answer-btns">
            <button class="btn btn-yes${answered === 'Ναι' ? ' active' : ''}" data-answer="Ναι" data-id="${q.ID}">✅ Ναι</button>
            <button class="btn btn-no${answered === 'Όχι' ? ' active' : ''}" data-answer="Όχι" data-id="${q.ID}">❌ Όχι</button>
          </div>`
        : `<div class="an-item-meta" style="margin-top:8px;">Η απάντησή σου: ${answered ? (answered === 'Ναι' ? '✅ Ναι' : '❌ Όχι') : '— δεν απάντησες —'}</div>`;
    }
    return `
      <div class="an-item">
        <div class="an-item-head">
          <div>
            <div class="an-item-title">${escapeHtml(q.Question)}</div>
            <div class="an-item-meta">${escapeHtml(q.CreatedByName) || '—'} · ${deadlineLabel}</div>
          </div>
          ${badge}
        </div>
        ${bodyHtml}
      </div>
    `;
  }

  function renderAvailabilityQueriesTechnician(queries, tool, roleLabel) {
    const content = document.getElementById('content');
    const active = queries.filter(q => q.Active);
    const past = queries.filter(q => !q.Active);

    content.className = '';
    content.innerHTML = `
      ${topbar(tool, roleLabel)}

      <div class="card">
        <div class="card-title">Ενεργά ερωτήματα (${active.length})</div>
        ${active.length ? active.map(avqTechnicianItem).join('') : '<div class="empty">Κανένα ενεργό ερώτημα αυτή τη στιγμή</div>'}
      </div>
      ${past.length ? `
      <div class="card">
        <div class="card-title">Ιστορικό (${past.length})</div>
        ${past.map(avqTechnicianItem).join('')}
      </div>` : ''}
    `;

    content.querySelectorAll('button[data-answer]').forEach(btn => {
      btn.addEventListener('click', () => submitAvailabilityAnswerUi(btn.dataset.id, btn.dataset.answer, tool, roleLabel));
    });
    content.querySelectorAll('button[data-ack]').forEach(btn => {
      // Το answer value εδώ είναι μόνο ενδεικτικό — ο server επιβάλλει πάντα
      // τη σταθερή τιμή ACK_VALUE για ερωτήματα ResponseMode «ACK» (βλ.
      // submitAvailabilityAnswer στο src/availability.js).
      btn.addEventListener('click', () => submitAvailabilityAnswerUi(btn.dataset.id, 'ΕΛΑΒΕ ΓΝΩΣΗ', tool, roleLabel));
    });
  }

  async function submitAvailabilityAnswerUi(id, answer, tool, roleLabel) {
    try {
      const res = await fetch('/api/availability/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ queryId: id, answer }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία καταχώρησης.');
      renderAvailabilityQueries(tool, roleLabel);
      refreshNavBadges();
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

  /** Κοινό label απάντησης — χρησιμοποιείται και στο Προφίλ Τεχνικού (5484+). */
  function avqAnswerLabel(q) {
    if (avqIsNone(q)) return 'ℹ️ Ενημερωτικό (χωρίς απάντηση)';
    if (avqIsAck(q)) {
      return q.MyAnswer ? '✓ Το είδε' : (q.Active ? '⏳ δεν το είδε ακόμα' : '— δεν το είδε —');
    }
    return q.MyAnswer ? (q.MyAnswer === 'Ναι' ? '✅ Ναι' : '❌ Όχι') : (q.Active ? '⏳ δεν απάντησε ακόμα' : '— δεν απάντησε —');
  }

  function avqNamesList(label, names) {
    if (!names.length) return `<div class="avq-names">${label}: —</div>`;
    return `<details class="avq-names"><summary>${label} (${names.length})</summary>${names.join(', ')}</details>`;
  }

  function avqLeaderItem(q) {
    const isAck = avqIsAck(q);
    const isNone = avqIsNone(q);
    const badge = q.Scheduled
      ? `<span class="status-pill st-info">Προγραμματισμένο · ${fmtDate(q.PublishAt)}</span>`
      : (q.Active ? '<span class="status-pill st-ok">Ενεργό</span>' : '<span class="status-pill st-bad">Έληξε</span>');
    const typeBadge = isNone
      ? '<span class="status-pill st-info">ℹ️ Ενημερωτικό</span>'
      : (isAck ? '<span class="status-pill st-info">👁 Έλαβα γνώση</span>' : '<span class="status-pill st-info">🙋 Ναι/Όχι</span>');
    const teamsLabel = q.TargetTeams.includes('ALL') ? 'Όλες οι ειδικότητες' : q.TargetTeams.join(', ');
    const deadlineLabel = (isAck || isNone) ? 'Ενημερωτικό (χωρίς προθεσμία)' : (q.Deadline ? `Προθεσμία ${fmtDate(q.Deadline)}` : 'Χωρίς λήξη');
    let countsHtml;
    if (isNone) {
      // Καμία παρακολούθηση/μέτρηση — μόνο το πλήθος του στοχευμένου κοινού.
      countsHtml = `<div class="avq-counts"><span>Στοχευμένοι: <b>${q.TotalTargeted}</b> τεχνικοί (χωρίς παρακολούθηση απάντησης)</span></div>`;
    } else if (isAck) {
      countsHtml = `<div class="avq-counts">
          <span>👁 <b>${q.YesNames.length}</b> είδαν</span>
          <span>⏳ <b>${q.PendingNames.length}</b> δεν έχουν δει ακόμα · από ${q.TotalTargeted}</span>
        </div>
        ${avqNamesList('Είδαν', q.YesNames)}
        ${avqNamesList('Δεν έχουν δει ακόμα', q.PendingNames)}`;
    } else {
      countsHtml = `<div class="avq-counts">
          <span>✅ <b>${q.YesNames.length}</b></span>
          <span>❌ <b>${q.NoNames.length}</b></span>
          <span>⏳ <b>${q.PendingNames.length}</b> από ${q.TotalTargeted}</span>
        </div>
        ${avqNamesList('Ναι', q.YesNames)}
        ${avqNamesList('Όχι', q.NoNames)}
        ${avqNamesList('Δεν απάντησαν', q.PendingNames)}`;
    }
    return `
      <div class="an-item">
        <div class="an-item-head">
          <div>
            <div class="an-item-title">${escapeHtml(q.Question)}</div>
            <div class="an-item-meta">${escapeHtml(q.CreatedByName) || '—'} · ${deadlineLabel} · ${teamsLabel}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${typeBadge}
            ${badge}
            <button class="icon-btn" data-action="avq-edit" data-id="${q.ID}">Επεξεργασία</button>
            <button class="icon-btn danger" data-action="avq-delete" data-id="${q.ID}">Διαγραφή</button>
          </div>
        </div>
        ${countsHtml}
      </div>
    `;
  }

  /** Επεξεργασία υπάρχοντος ερωτήματος (ρητή απαίτηση χρήστη, 15/08/2026) — reuse της ίδιας φόρμας
   * "Νέο ερώτημα" αντί για ξεχωριστό modal/φόρμα (ίδιο μοτίβο minimal-diff με τα υπόλοιπα edit σημεία του
   * portal, π.χ. inline επεξεργασία γραμμής στο Εξοπλισμό). Το avq-add-btn αλλάζει ρόλο μέσω
   * data-editing-id — καθαρά client-side state, καμία επίδραση στο backend αν δεν πατηθεί αποθήκευση. */
  function avqStartEdit(q) {
    document.getElementById('avq-question').value = q.Question;
    const isAck = avqIsAck(q);
    const isNone = avqIsNone(q);
    document.getElementById('avq-mode-yesno').checked = !isAck && !isNone;
    document.getElementById('avq-mode-ack').checked = isAck;
    document.getElementById('avq-mode-none').checked = isNone;
    document.getElementById('avq-deadline-field').style.display = (isAck || isNone) ? 'none' : '';
    const deadlineInput = document.getElementById('avq-deadline');
    const noDeadlineCb = document.getElementById('avq-no-deadline');
    deadlineInput.value = q.Deadline || '';
    noDeadlineCb.checked = !q.Deadline;
    deadlineInput.disabled = !q.Deadline;
    const publishInput = document.getElementById('avq-publish-at');
    if (q.Scheduled) {
      publishInput.value = q.PublishAt || '';
      publishInput.disabled = false;
      publishInput.placeholder = '';
    } else {
      publishInput.value = '';
      publishInput.disabled = true;
      publishInput.placeholder = 'Ήδη δημοσιευμένο';
    }
    const allCb = document.querySelector('.avq-team-all');
    const teamCbs = document.querySelectorAll('.avq-team-cb');
    const isAll = q.TargetTeams.includes('ALL');
    allCb.checked = isAll;
    teamCbs.forEach(cb => {
      cb.disabled = isAll;
      cb.checked = !isAll && q.TargetTeams.includes(cb.value);
    });
    document.getElementById('avq-form-title').textContent = 'Επεξεργασία ερωτήματος';
    const addBtn = document.getElementById('avq-add-btn');
    addBtn.textContent = 'Αποθήκευση αλλαγών';
    addBtn.dataset.editingId = q.ID;
    document.getElementById('avq-cancel-edit-btn').style.display = '';
    document.getElementById('avq-question').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function avqCancelEdit() {
    document.getElementById('avq-question').value = '';
    document.getElementById('avq-mode-yesno').checked = true;
    document.getElementById('avq-mode-ack').checked = false;
    document.getElementById('avq-mode-none').checked = false;
    document.getElementById('avq-deadline-field').style.display = '';
    const deadlineInput = document.getElementById('avq-deadline');
    deadlineInput.value = '';
    deadlineInput.disabled = false;
    document.getElementById('avq-no-deadline').checked = false;
    const publishInput = document.getElementById('avq-publish-at');
    publishInput.value = '';
    publishInput.disabled = false;
    publishInput.placeholder = '';
    document.querySelector('.avq-team-all').checked = false;
    document.querySelectorAll('.avq-team-cb').forEach(cb => { cb.disabled = false; cb.checked = false; });
    document.getElementById('avq-form-title').textContent = 'Νέο ερώτημα διαθεσιμότητας';
    const addBtn = document.getElementById('avq-add-btn');
    addBtn.textContent = 'Δημιουργία';
    delete addBtn.dataset.editingId;
    document.getElementById('avq-cancel-edit-btn').style.display = 'none';
  }

  async function createAvailabilityQueryUi(tool, roleLabel) {
    const question = document.getElementById('avq-question').value.trim();
    const responseMode = document.getElementById('avq-mode-ack').checked ? 'ACK'
      : document.getElementById('avq-mode-none').checked ? 'NONE' : 'YESNO';
    const isYesNo = responseMode === 'YESNO';
    const noDeadline = document.getElementById('avq-no-deadline').checked;
    const deadline = (!isYesNo || noDeadline) ? '' : document.getElementById('avq-deadline').value;
    const publishInput = document.getElementById('avq-publish-at');
    const publishAt = publishInput.disabled ? '' : publishInput.value;
    const allChecked = document.querySelector('.avq-team-all').checked;
    const targetTeams = allChecked
      ? ['ALL']
      : Array.from(document.querySelectorAll('.avq-team-cb:checked')).map(cb => cb.value);
    const msg = document.getElementById('avq-add-msg');
    const btn = document.getElementById('avq-add-btn');
    const editingId = btn.dataset.editingId;

    if (!question) { msg.textContent = 'Χρειάζεται κείμενο ερωτήματος.'; msg.className = 'msg err'; return; }
    if (isYesNo && !noDeadline && !deadline) { msg.textContent = 'Χρειάζεται προθεσμία, ή επίλεξε «Χωρίς λήξη».'; msg.className = 'msg err'; return; }
    if (!targetTeams.length) { msg.textContent = 'Επίλεξε τουλάχιστον μία ειδικότητα.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = editingId ? 'Αποθήκευση...' : 'Δημιουργία...'; msg.className = 'msg';

    try {
      const url = editingId ? '/api/availability/query/update' : '/api/availability/query';
      const payload = editingId
        ? { id: editingId, question, deadline, targetTeams, publishAt, responseMode }
        : { question, deadline, targetTeams, publishAt, responseMode };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || (editingId ? 'Αποτυχία ενημέρωσης.' : 'Αποτυχία δημιουργίας.'));
      renderAvailabilityQueries(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  async function deleteAvailabilityQueryUi(id, tool, roleLabel) {
    if (!confirm('Διαγραφή αυτού του ερωτήματος; Οι απαντήσεις που έχουν ήδη δοθεί δεν θα φαίνονται πια πουθενά.')) return;
    try {
      const res = await fetch('/api/availability/query/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία διαγραφής.');
      renderAvailabilityQueries(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

  async function renderDashboard(tool, roleLabel) {
    const content = document.getElementById('content');

    const role = CURRENT_WHO.staffRole;
    const showTeam = role === 'leader' || role === 'director';
    const showBackoffice = role === 'backoffice' || role === 'director';

    try {
      const jobs = { activity: fetch('/api/dashboard/activity').then(r => r.json()) };

        jobs.fleet = fetch('/api/fleet').then(r => r.json());
      }
      if (showBackoffice) {
        jobs.availability = fetch('/api/backoffice/availability').then(r => r.json());
        jobs.crews = fetch('/api/crews?date=' + encodeURIComponent(todayStr())).then(r => r.json());
      }

      const keys = Object.keys(jobs);
      const values = await Promise.all(keys.map(k => jobs[k]));
      const data = {};
      keys.forEach((k, i) => { data[k] = values[i]; });

      const tiles = [];

      if (showTeam) {
        const pending = data.team.pendingCount || 0;
        tiles.push({
          icon: '🗓️', key: 'teamleaves', label: 'Εκκρεμείς αιτήσεις άδειας', value: pending,
          tone: pending > 0 ? 'warn' : 'ok',
          sub: pending > 0 ? (pending === 1 ? 'χρειάζεται απόφαση' : 'χρειάζονται απόφαση') : 'καμία εκκρεμότητα',
        });

        const alertCount = (data.fleet.vehicles || []).filter(v =>
          ['warn', 'bad'].includes(fleetDateAlertLevel(v.KteoDate)) || ['warn', 'bad'].includes(fleetDateAlertLevel(v.ServiceDate))
        ).length;
        tiles.push({
          icon: '🚐', key: 'fleet', label: 'ΚΤΕΟ/Service λήγουν ή έληξαν', value: alertCount,
          tone: alertCount > 0 ? 'bad' : 'ok',
          sub: alertCount > 0 ? 'χρειάζεται έλεγχος' : 'όλα εντάξει',
        });
      }

      if (showBackoffice) {
        const allTechs = (data.availability.groups || []).flatMap(g => g.technicians);
        const onLeaveToday = allTechs.filter(t => t.status === 'onleave').length;
        tiles.push({
          icon: '🧑‍🔧', key: 'availability', label: 'Τεχνικοί σε άδεια σήμερα', value: onLeaveToday,
          tone: 'accent', sub: `από σύνολο ${allTechs.length} τεχνικών`,
        });

        const crews = data.crews.crews || [];
        const assignedToday = crews.reduce((sum, c) => sum + (c.memberIds ? c.memberIds.length : 0), 0);
        tiles.push({
          icon: '👷', key: 'crews', label: 'Τεχνικοί σε συνεργείο σήμερα', value: assignedToday,
          tone: 'accent', sub: `${crews.length} συνεργεία σήμερα`,
        });
      }

      const hasIssues = tiles.some(t => t.tone === 'warn' || t.tone === 'bad');
      const activity = (data.activity && data.activity.entries) || [];

      content.className = '';
      content.innerHTML = `
        <div class="topbar" style="border-bottom:none; padding-bottom:0; margin-bottom:20px;">
          <div><h1>${tool.name}</h1><p>${hasIssues ? 'Υπάρχουν σημεία που χρειάζονται προσοχή παρακάτω.' : 'Όλα κυλούν ομαλά σήμερα.'}</p></div>
        </div>
        <div class="dash-tiles" id="dash-tiles">
          ${tiles.map(t => `
            <button class="dash-tile" type="button" data-key="${t.key}">
              <div class="dash-tile-top">
                <div class="dash-tile-icon tone-${t.tone}">${t.icon}</div>
                <div class="dash-tile-arrow">→</div>
              </div>
              <div>
                <div class="num">${t.value}</div>
                <div class="label">${t.label}</div>
                <div class="sub tone-${t.tone}">${t.sub}</div>
              </div>
            </button>
          `).join('')}
        </div>

        <div class="card">
          <div class="card-title">Τελευταία δραστηριότητα</div>
          ${activity.length ? `
            <table>
              <thead><tr><th>Εγγραφή</th><th>Ενέργεια</th><th>Τομέας</th><th>Πότε</th></tr></thead>
              <tbody>
                ${activity.map(a => `
                  <tr>
                    <td>${a.actor}</td>
                    <td>${a.label}</td>
                    <td><span class="status-pill ${dashActivityTone(a.category)}">${a.category}</span></td>
                    <td class="cell-muted">${fmtDateTime(a.at)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="empty">Καμία πρόσφατη δραστηριότητα.</div>'}
        </div>
      `;

      document.querySelectorAll('#dash-tiles .dash-tile').forEach(el => {
        el.addEventListener('click', () => goToTool(el.dataset.key, roleLabel));
      });
    } catch (err) {
      content.className = 'err';
      content.textContent = 'Σφάλμα: ' + (err.message || err);
    }
  }

  /** Χρωματικός τόνος badge ανά κατηγορία δραστηριότητας — απλή εναλλαγή
   * μεταξύ των ήδη dark-mode-safe τόνων .status-pill, χωρίς νέα hardcoded
   * χρώματα (item «Τελευταία δραστηριότητα», 18/08/2026). */
  function dashActivityTone(category) {
    const map = {
      'Άδειες': 'st-warn',
      'Στόλος': 'st-info',
      'Εξοπλισμός': 'st-ok',
      'e-pass': 'st-info',
      'Χρεώσεις': 'st-ok',
      'Παράδοση': 'st-warn',
      'Ανακοινώσεις': 'st-info',
      'Συνεργεία': 'st-ok',
      'Ενημερώσεις': 'st-info',
      'Προσωπικό': 'st-ok',
    };
    return map[category] || 'st-info';
  }

  /** Πλοήγηση από ένα dashboard tile στο αντίστοιχο tab, ενημερώνοντας και το active state του sidebar */
  function goToTool(key, roleLabel) {
    const tools = CURRENT_WHO.role === 'technician' ? TOOLS.technician : (TOOLS[CURRENT_WHO.staffRole] || TOOLS.leader);
    const target = tools.find(t => t.key === key);
    if (!target) return;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

    if (btn) btn.classList.add('active');

  /** Μορφοποιεί μια τιμή Details — nested objects/arrays (π.χ. το `snapshot` της διαγραφής άδειας) γίνονται JSON.stringify αντί για "[object Object]" */
  function auditDetailValueText(v) {
    if (v && typeof v === 'object') return JSON.stringify(v);
    return v;
  }

  function auditDetailsText(raw) {
    if (!raw) return '<span class="cell-muted">—</span>';
    try {
      const obj = JSON.parse(raw);
      if (obj && typeof obj === 'object') {
        return Object.entries(obj).map(([k, v]) => `${k}: ${auditDetailValueText(v)}`).join(', ');
      }
    } catch {}
    return String(raw);
  }

  /** Ίδιο με auditDetailsText, χωρίς HTML — για CSV export (item #120) */
  function auditDetailsPlainText(raw) {
    if (!raw) return '';
    try {
      const obj = JSON.parse(raw);
      if (obj && typeof obj === 'object') {
        return Object.entries(obj).map(([k, v]) => `${k}: ${auditDetailValueText(v)}`).join(', ');
      }
    } catch {}
    return String(raw);
  }

    document.getElementById('bk-create-btn').addEventListener('click', async () => {

        const result = await res.json();

        msgEl.innerHTML = `<p class="msg ok">Το backup δημιουργήθηκε (${result.sheetCount} φύλλα${result.errors && result.errors.length ? `, ${result.errors.length} σφάλματα` : ''}).</p>`;

  /** Ανθρώπινη μορφή μεγέθους αρχείου (bytes -> KB/MB) — μόνο για το tab Backup */
  function fmtBytes(n) {
    if (!n && n !== 0) return '—';
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  }

        <div class="metric"><div class="label">Μ.ο. τεχνικών/ημέρα σε συνεργεία</div><div class="num">${crews.average}</div></div>

  // αλλιώς συμπληρώνει ο TL/Director) + τη δική του render() που παράγει

  function docFmtGrDate(iso) {

    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  const DOCUMENT_TYPES = {

        { key: 'endDate', label: 'Ημερομηνία λήξης', type: 'date', auto: () => '' },

      ],
      render(fields) {
        const today = new Date().toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const fullName = escapeHtml(fields.fullName);
        const fatherName = escapeHtml(fields.fatherName);
        const idNumber = escapeHtml(fields.idNumber);
        const cityArea = escapeHtml(fields.cityArea);
        const streetInfo = escapeHtml(fields.streetInfo);
        const startDate = escapeHtml(docFmtGrDate(fields.startDate));
        const endDate = escapeHtml(docFmtGrDate(fields.endDate));
        const reason = escapeHtml(fields.reason);
        return `<!DOCTYPE html>

  function printDocumentType(docTypeKey, fields) {
    const docType = DOCUMENT_TYPES[docTypeKey];

  async function renderDocuments(tool, roleLabel) {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.innerHTML = loadingBarHtml('Φόρτωση...');

    try {

      content.className = 'err';

    }

    const docTypeOptions = Object.keys(DOCUMENT_TYPES).map(k => `<option value="${k}">${escapeHtml(DOCUMENT_TYPES[k].label)}</option>`).join('');

    content.className = '';
    content.innerHTML = `

            </select>

        <div id="doc-fields-area"></div>

          method: 'POST',

    return h.Type || 'Εξοπλισμός';
  }

  /** Διάστημα απασχόλησης από hireDate έως endDate (προαιρετικό, προεπιλογή σήμερα) — client-side υπολογισμός,
   * ΔΕΝ αποθηκεύεται πουθενά. Το `endDate` προστέθηκε για το «Διάστημα Απασχόλησης» ενός Ανενεργού τεχνικού
   * (item #5, 13/08/2026) — τότε περνάμε το InactiveDate αντί για «σήμερα», ίδια συνάρτηση/λογική με πριν. */
  function tpEmploymentDuration(hireDate, endDate) {
    if (!hireDate) return '—';
    const d = new Date(hireDate);
    if (isNaN(d.getTime())) return '—';
    const now = endDate ? new Date(endDate) : new Date();
    if (isNaN(now.getTime())) return '—';
    let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
    if (now.getDate() < d.getDate()) months -= 1;
    if (months < 0) return '—';
    if (months === 0) return 'λιγότερο από 1 μήνα';
    const years = Math.floor(months / 12);
    const remMonths = months % 12;
    const parts = [];
    if (years > 0) parts.push(years + (years === 1 ? ' χρόνο' : ' χρόνια'));
    if (remMonths > 0) parts.push(remMonths + (remMonths === 1 ? ' μήνα' : ' μήνες'));
    return parts.join(' και ');
  }
  const tpYearsAtCompany = tpEmploymentDuration;

  /** Τεχνική κατάρτιση σε bullets (ρητή απαίτηση χρήστη) — καθαρά αλλαγή εμφάνισης, το πεδίο εισαγωγής (nt-training
   * στο Νέος Τεχνικός) παραμένει ένα ελεύθερο πεδίο κειμένου, το χωρίζουμε με κόμμα (ίδιο με το placeholder του
   * πεδίου: "π.χ. πιστοποιήσεις, σεμινάρια, ειδικότητες") — καμία αλλαγή στο Sheet/backend. */
  function tpTrainingBullets(text) {
    const items = String(text || '').split(',').map((s) => s.trim()).filter(Boolean);
    if (!items.length) return '—';
    return `<ul style="margin:4px 0 0; padding-left:18px;">${items.map((i) => `<li>${i}</li>`).join('')}</ul>`;
  }

  /** Redesign κάρτας ταυτότητας (02/09/2026, ρητή απαίτηση χρήστη — τα στοιχεία
   * ήταν «ανακατεμένα», preview εγκρίθηκε πριν την υλοποίηση, Επιλογή Α):
   * κάθε ενότητα (Επικοινωνία/Στοιχεία ταυτότητας/Απασχόληση) παίρνει μικρό
   * uppercase section-label με εικονίδιο, και κάθε πεδίο δείχνεται ως ετικέτα
   * ΠΑΝΩ από την τιμή (tp-field-label/tp-field-value) αντί για το παλιό
   * icon+«Ετικέτα: τιμή» σε 3 flex στήλες. */
  function tpField(label, value) {
    return `<div><div class="tp-field-label">${label}</div><div class="tp-field-value">${value}</div></div>`;
  }
  function tpSection(icon, title, innerHtml, extraClass) {
    return `<div class="tp-section${extraClass ? ' ' + extraClass : ''}"><div class="tp-section-label"><i class="ti ${icon}"></i>${title}</div>${innerHtml}</div>`;
  }
  /** Παραλλαγή «σε στήλες» (02/09/2026, ρητή απαίτηση χρήστη μετά από preview
   * σύγκρισης) — ίδιο section-label header με το tpSection(), αλλά τα πεδία
   * στοιβάζονται κάθετα (tp-field-list) μέσα σε μία από N στήλες δίπλα-δίπλα
   * (.tp-section-col, γονιός .tp-section-columns) αντί για οριζόντιο grid. */
  function tpSectionCol(icon, title, fieldsHtml) {
    return `<div class="tp-section-col"><div class="tp-section-label"><i class="ti ${icon}"></i>${title}</div><div class="tp-field-list">${fieldsHtml}</div></div>`;

  function tpStatusBadge(status) {

        </div>

        <div class="card">
          <div class="card-title">Απαντήσεις Ανακοινώσεων (${availabilityAnswers.length})</div>
          <table>
            <thead><tr><th>Ερώτημα</th><th>Προθεσμία</th><th class="ta-center">Κατάσταση</th><th>Απάντηση</th></tr></thead>
            <tbody>${availabilityAnswers.length ? availabilityAnswers.map(q => `
              <tr>
                <td>${escapeHtml(q.Question)}</td>
                <td>${fmtDate(q.Deadline)}</td>
                <td class="ta-center">${q.Active ? '<span class="status-pill st-ok">Ενεργό</span>' : '<span class="status-pill st-bad">Έληξε</span>'}</td>
                <td>${avqAnswerLabel(q)}</td>
              </tr>
            `).join('') : '<tr><td colspan="4" class="empty">Καμία ανακοίνωση δεν τον/την αφορούσε ακόμα</td></tr>'}</tbody>
          </table>
        </div>

        <div class="card">
          <div class="form-actions">
            <button class="btn btn-ghost" id="tp-eval-btn">Άνοιγμα φόρμας Αξιολόγησης →</button>
            <span class="msg">Ανοίγει σε νέα καρτέλα — καμία προσυμπλήρωση στοιχείων.</span>
          </div>
        </div>
      `;

      document.getElementById('tp-eval-btn').addEventListener('click', () => window.open('/evaluation.html', '_blank'));

      // Επεξεργασία στοιχείων — modal, ρητή απαίτηση χρήστη 19/08/2026. Το
      // άνοιγμα του modal γίνεται ήδη από τον κοινό delegated listener
      // (data-modal-open, βλ. openModal παρακάτω στο αρχείο) — εδώ μόνο το
      // "Άλλη περιοχή..." toggle και η αποθήκευση.
      const tpEditTeamSelect = document.getElementById('tp-edit-team-select');
      if (tpEditTeamSelect) {
        tpEditTeamSelect.addEventListener('change', (e) => {
          document.getElementById('tp-edit-team-other').style.display = e.target.value === '__other__' ? '' : 'none';
        });
      }
      const tpEditSaveBtn = document.getElementById('tp-edit-save-btn');
      if (tpEditSaveBtn) {
        tpEditSaveBtn.addEventListener('click', async () => {
          const editMsg = document.getElementById('tp-edit-msg');
          const name = document.getElementById('tp-edit-name').value.trim();
          const teamLeaderEmail = document.getElementById('tp-edit-leader').value;
          if (!name) { editMsg.textContent = 'Χρειάζεται ονοματεπώνυμο.'; editMsg.className = 'msg err'; return; }
          if (!teamLeaderEmail) { editMsg.textContent = 'Επίλεξε Team Leader.'; editMsg.className = 'msg err'; return; }

          const teamSelectVal = document.getElementById('tp-edit-team-select').value;
          const team = teamSelectVal === '__other__' ? document.getElementById('tp-edit-team-other').value.trim() : teamSelectVal;

          tpEditSaveBtn.disabled = true;
          editMsg.textContent = 'Αποθήκευση...'; editMsg.className = 'msg';
          try {
            const res = await fetch('/api/employees/update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                employeeId: emp.EmployeeID,
                name,
                email: document.getElementById('tp-edit-email').value.trim(),
                teamLeaderEmail,
                annualDays: document.getElementById('tp-edit-days').value,
                team,
                hasDrivingLicense: !!document.getElementById('tp-edit-license').value,
                ama: document.getElementById('tp-edit-ama').value.trim(),
                amka: document.getElementById('tp-edit-amka').value.trim(),
                afm: document.getElementById('tp-edit-afm').value.trim(),
                fatherName: document.getElementById('tp-edit-father-name').value.trim(),
                idNumber: document.getElementById('tp-edit-id-number').value.trim(),
                phone: document.getElementById('tp-edit-phone').value.trim(),
                companyPhone: document.getElementById('tp-edit-company-phone').value.trim(),
                address: document.getElementById('tp-edit-address').value.trim(),
                hireDate: document.getElementById('tp-edit-hiredate').value,
                technicalTraining: document.getElementById('tp-edit-training').value.trim(),
                priorExperience: document.getElementById('tp-edit-prior-experience').value.trim(),
                huskiesUsername: document.getElementById('tp-edit-huskies-user').value.trim(),
                huskiesPassword: document.getElementById('tp-edit-huskies-pass').value.trim(),
              }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Αποτυχία αποθήκευσης.');
            closeModal('tp-edit-modal');
            await loadTechProfile();
          } catch (err) {
            editMsg.textContent = 'Σφάλμα: ' + (err.message || err); editMsg.className = 'msg err';
          } finally {
            tpEditSaveBtn.disabled = false;
          }
        });
      }

      // Huskies — κρυμμένο password με κουμπί «Εμφάνιση» (ρητή απόφαση
      // χρήστη 24/08/2026) + αποστολή email (μόνο τα Huskies credentials,
      // ρητή απόφαση χρήστη). Η πραγματική τιμή είναι ήδη στο DOM
      // (data-value) — μόνο TL/Director βλέπουν καν αυτή την κάρτα/tab, ίδιο
      // επίπεδο έκθεσης με τα υπόλοιπα ευαίσθητα πεδία εδώ (ΑΜΚΑ/ΑΦΜ).
      const huskiesToggleBtn = document.getElementById('tp-huskies-toggle-btn');
      if (huskiesToggleBtn) {
        huskiesToggleBtn.addEventListener('click', () => {
          const valueEl = document.getElementById('tp-huskies-pass-value');
          const visible = valueEl.getAttribute('data-visible') === '1';
          if (visible) {
            valueEl.textContent = '••••••••';
            valueEl.setAttribute('data-visible', '0');
            huskiesToggleBtn.textContent = 'Εμφάνιση';
          } else {
            valueEl.textContent = valueEl.getAttribute('data-value') || '—';
            valueEl.setAttribute('data-visible', '1');
            huskiesToggleBtn.textContent = 'Απόκρυψη';
          }
        });
      }
      const huskiesSendBtn = document.getElementById('tp-huskies-send-btn');
      if (huskiesSendBtn) {
        huskiesSendBtn.addEventListener('click', async () => {
          const huskiesMsg = document.getElementById('tp-huskies-msg');
          huskiesSendBtn.disabled = true;
          huskiesMsg.textContent = 'Αποστολή...'; huskiesMsg.className = 'msg';
          try {
            const res = await fetch('/api/employees/huskies/send-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ employeeId: huskiesSendBtn.getAttribute('data-employee-id') }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Αποτυχία αποστολής.');
            huskiesMsg.textContent = 'Το email στάλθηκε.';
            huskiesMsg.className = 'msg ok';
          } catch (err) {
            huskiesMsg.textContent = 'Σφάλμα: ' + (err.message || err);
            huskiesMsg.className = 'msg err';
          } finally {
            huskiesSendBtn.disabled = false;
          }
        });
      }

      // Reset PIN — μετακομίστηκε εδώ (ίδια γραμμή με Ενεργοποίηση/Απενεργοποίηση, ρητή απαίτηση χρήστη
      // 15/08/2026) δίπλα από την ήδη υπάρχουσα κάρτα στο tab «Νέος Τεχνικός» (ΔΕΝ αφαιρέθηκε από εκεί —
      // το Backoffice έχει πρόσβαση στο "Νέος Τεχνικός" αλλά ΟΧΙ στο "Προφίλ Τεχνικού", άρα η αφαίρεση θα
      // του έκοβε εντελώς τη δυνατότητα reset PIN. Ίδιο backend endpoint, καμία αλλαγή εκεί.)
      const resetPinBtn = document.getElementById('tp-reset-pin-btn');
      if (resetPinBtn) {
        resetPinBtn.addEventListener('click', async () => {
          if (!confirm(`Να γίνει reset το PIN για: ${emp.Name};`)) return;
          const statusMsg = document.getElementById('tp-status-msg');
          resetPinBtn.disabled = true;
          statusMsg.textContent = 'Αποστολή...'; statusMsg.className = 'msg';
          try {
            const res = await fetch('/api/employees/reset-pin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ employeeId: resetPinBtn.getAttribute('data-employee-id') }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Αποτυχία reset.');
            statusMsg.textContent = `Νέο PIN: ${data.pin}${data.emailSent ? ' (στάλθηκε και με email)' : ''} — σημείωσέ το τώρα, δεν θα ξαναφανεί.`;
            statusMsg.className = 'msg ok';
          } catch (err) {
            statusMsg.textContent = 'Σφάλμα: ' + (err.message || err); statusMsg.className = 'msg err';
          } finally {
            resetPinBtn.disabled = false;
          }
        });
      }

      const statusBtn = document.getElementById('tp-status-toggle');
      if (statusBtn) {
        statusBtn.addEventListener('click', async () => {
          const currentStatus = statusBtn.getAttribute('data-current-status');
          const nextStatus = currentStatus === 'Ανενεργός' ? 'Ενεργός' : 'Ανενεργός';
          const confirmMsg = nextStatus === 'Ανενεργός'
            ? `Απενεργοποίηση του/της ${emp.Name}; Δεν θα μπορεί πλέον να συνδεθεί στο portal (PIN) και θα εξαφανιστεί από τις δεξαμενές τεχνικών (Συνεργεία, Reset PIN). Παραμένει ορατός/ή εδώ για ιστορικό.`
            : `Επανενεργοποίηση του/της ${emp.Name}; Θα μπορεί ξανά να συνδεθεί με το PIN του/της.`;
          if (!confirm(confirmMsg)) return;

          const statusMsg = document.getElementById('tp-status-msg');
          statusBtn.disabled = true;
          statusMsg.textContent = 'Ενημέρωση...'; statusMsg.className = 'msg';
          try {
            const res = await fetch('/api/employees/status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ employeeId: statusBtn.getAttribute('data-employee-id'), status: nextStatus }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Αποτυχία ενημέρωσης.');
            statusMsg.textContent = ''; statusMsg.className = 'msg';
            await loadTechProfile();
          } catch (err) {
            statusMsg.textContent = 'Σφάλμα: ' + (err.message || err); statusMsg.className = 'msg err';
            statusBtn.disabled = false;
          }
        });
      }

      resultsEl.querySelectorAll('[data-doc-download]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const docType = a.getAttribute('data-doc-download');
          window.open('/api/employees/document?' + new URLSearchParams({ employeeId, docType }).toString(), '_blank');
        });
      });

      resultsEl.querySelectorAll('[data-doc-upload]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const docType = btn.getAttribute('data-doc-upload');
          const fileInput = document.getElementById('tp-doc-file-' + docType);
          const docMsg = document.getElementById('tp-doc-msg');
          const file = fileInput.files[0];
          if (!file) { docMsg.textContent = 'Επίλεξε αρχείο πρώτα.'; docMsg.className = 'msg err'; return; }
          docMsg.textContent = 'Ανέβασμα...'; docMsg.className = 'msg';
          try {
            const upRes = await fetch('/api/employees/document/upload?' + new URLSearchParams({ employeeId, docType, filename: file.name }).toString(), {
              method: 'POST',
              headers: { 'Content-Type': file.type || 'application/octet-stream' },
              body: file,
            });
            const upData = await upRes.json();
            if (!upRes.ok) throw new Error(upData.error || 'Αποτυχία ανεβάσματος.');
            docMsg.textContent = 'Το αρχείο ανέβηκε.'; docMsg.className = 'msg ok';
            document.getElementById('tp-doc-current-' + docType).innerHTML = `<a href="#" data-doc-download="${docType}">${file.name}</a>`;
            document.getElementById('tp-doc-current-' + docType).querySelector('[data-doc-download]').addEventListener('click', (e) => {
              e.preventDefault();
              window.open('/api/employees/document?' + new URLSearchParams({ employeeId, docType }).toString(), '_blank');
            });
          } catch (err) {
            docMsg.textContent = 'Σφάλμα: ' + (err.message || err); docMsg.className = 'msg err';
          }
        });
      });
    } catch (err) {
      resultsEl.innerHTML = '';
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
    }
  }

  init().catch(() => {
    document.getElementById('content').className = 'err';
    document.getElementById('content').textContent = 'Σφάλμα φόρτωσης. Δοκίμασε ξανά.';
  });
</script>

</body>
</html>
