  function mountTechCalendar(container, events) {
    const pad = (n) => String(n).padStart(2, '0');
    const MONTH_NAMES = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
    const DOW = ['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'];

    const cursor = new Date();
    cursor.setDate(1);

    function eventsOnDay(dateStr) {
      // Οι άδειες/τηλεργασία έχουν εύρος (date=StartDate, endDate=EndDate) —
      // τα υπόλοιπα γεγονότα (παραλαβή/επιστροφή/ΚΤΕΟ/Service) είναι
      // μεμονωμένη ημέρα (endDate === date). normalizeDateStr() εδώ για τον
      // ίδιο λόγο με το mountLeaveCalendar παραπάνω.
      return events.filter(e => {
        const s = normalizeDateStr(e.date);
        const en = normalizeDateStr(e.endDate || e.date);
        return s && s <= dateStr && en >= dateStr;
      });
    }

    function render() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7; // 0 = Δευτέρα
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell cal-empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
        const dayEvents = eventsOnDay(dateStr);
        cells += `
          <div class="cal-cell${dateStr === todayStr ? ' cal-today' : ''}">
            <div class="cal-daynum">${day}</div>
            ${dayEvents.map(ev => `<div class="cal-chip ${techCalChipClass(ev)}" title="${ev.title}">${techCalChipLabel(ev)}</div>`).join('')}
          </div>`;
      }

      container.innerHTML = `
        <div class="cal-head">
          <button class="icon-btn" id="tc-cal-prev" aria-label="Προηγούμενος μήνας">‹</button>
          <div class="cal-title">${MONTH_NAMES[month]} ${year}</div>
          <button class="icon-btn" id="tc-cal-next" aria-label="Επόμενος μήνας">›</button>
        </div>
        <div class="cal-grid cal-dow-row">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend">
          <span class="cal-legend-item"><span class="cal-dot cal-dot-approved"></span> Άδεια (εγκεκριμένη)</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-pending"></span> Άδεια (εκκρεμεί)</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-telework"></span> Τηλεργασία</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-vehicle"></span> Παραλαβή/Επιστροφή οχήματος</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-maintenance"></span> ΚΤΕΟ/Service οχήματος</span>
        </div>
      `;

      container.querySelector('#tc-cal-prev').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() - 1); render(); });
      container.querySelector('#tc-cal-next').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() + 1); render(); });
    }

    render();
  }

  /**
   * Ενιαίος πίνακας «Αιτήσεις άδειας» (18/08/2026, redesign από screenshots) —
   * αντικαθιστά το παλιότερο ζεύγος «Προς έγκριση» (card-layout, μόνο
   * εκκρεμείς) + «Πρόσφατες αποφάσεις» (ξεχωριστός πίνακας, μόνο
   * αποφασισμένες). Εκκρεμείς + αποφασισμένες μαζί, πιο πρόσφατες πρώτα ανά
   * ενότητα (pending πάντα πρώτα, decided μετά — ίδια σειρά με πριν).
   * Ενέργειες Έγκριση/Απόρριψη μόνο στις εκκρεμείς· «—» στις αποφασισμένες.
   * Ίδια ομαδοποίηση τηλεργασίας (κοινό GroupID -> ΜΙΑ γραμμή/ΕΝΑ ζεύγος
   * κουμπιών) με πριν — ισχύει μόνο για τις εκκρεμείς, οι αποφασισμένες
   * μέρες τηλεργασίας παραμένουν ξεχωριστές γραμμές όπως πάντα.
   */
  function renderLeaveRequestsTable(pending, decided, tool, roleLabel) {
    const tbody = document.getElementById('tl-requests');

    // Ομαδοποίηση εκκρεμών τηλεργασίας με κοινό GroupID σε ΜΙΑ γραμμή/ένα
    // ζεύγος κουμπιών Έγκριση/Απόρριψη όλων — ίδια λογική με πριν
    // (02/09/2026: επιβεβαιώθηκε ρητά από τον χρήστη ότι η τηλεργασία
    // ΠΑΡΑΜΕΝΕΙ εδώ, ώστε ο TL να έχει τρόπο να την εγκρίνει/απορρίψει μέσα
    // από το portal — η εξαίρεση τηλεργασίας που ζητήθηκε αφορά ΜΟΝΟ την
    // «Αναζήτηση αδειών τεχνικού», βλ. searchTeamLeaves() παρακάτω).
    const items = [];
    const byGroupId = new Map();
    for (const r of (pending || [])) {
      if (r.Type === 'Τηλεργασία' && r.GroupID) {
        if (!byGroupId.has(r.GroupID)) {
          const group = { isGroup: true, groupId: r.GroupID, EmployeeName: r.EmployeeName, rows: [] };
          byGroupId.set(r.GroupID, group);
          items.push(group);
        }
        byGroupId.get(r.GroupID).rows.push(r);
      } else {
        items.push({ isGroup: false, row: r, pending: true });
      }
    }
    (decided || []).forEach(r => items.push({ isGroup: false, row: r, pending: false }));

    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Καμία αίτηση άδειας</td></tr>';
      return;
    }

    tbody.innerHTML = items.map(item => {
      if (item.isGroup) {
        // Ταξινόμηση με βάση την κανονικοποιημένη ISO τιμή (όχι raw
        // a.StartDate) — βλ. normalizeDateStr() (bug garbled ημερομηνιών,
        // 24/08/2026): raw Sheet τιμές δεν είναι πάντα ήδη σε ISO μορφή,
        // οπότε ένα raw localeCompare θα έδινε λάθος σειρά.
        const dates = item.rows.slice()
          .sort((a, b) => normalizeDateStr(a.StartDate).localeCompare(normalizeDateStr(b.StartDate)))
          .map(r => fmtDate(r.StartDate)).join(', ');
        return `
          <tr data-group-id="${item.groupId}">
            <td>${escapeHtml(item.EmployeeName)}</td>
            <td>Τηλεργασία</td>
            <td>${dates} (${item.rows.length} ημ.)</td>
            <td><span class="status-pill Εκκρεμεί">Εκκρεμεί</span></td>
            <td class="ta-right">
              <button class="btn btn-leave-approve" data-action="approve-group" data-group-id="${item.groupId}"><i class="ti ti-check"></i>Έγκριση</button>
              <button class="btn btn-leave-reject" data-action="reject-group" data-group-id="${item.groupId}"><i class="ti ti-x"></i>Απόρριψη</button>
            </td>
          </tr>`;
      }
      const r = item.row;
      const actions = item.pending
        ? `<button class="btn btn-leave-approve" data-action="approve" data-id="${r.ID}"><i class="ti ti-check"></i>Έγκριση</button>
           <button class="btn btn-leave-reject" data-action="reject" data-id="${r.ID}"><i class="ti ti-x"></i>Απόρριψη</button>`
        : '<span class="cell-muted">—</span>';
      return `
        <tr data-id="${r.ID}">
          <td>${escapeHtml(r.EmployeeName)}</td>
          <td>${r.Type}</td>
          <td>${fmtDate(r.StartDate)} – ${fmtDate(r.EndDate)} (${r.Days} ημ.) ${sickAttachmentBadge(r)}</td>
          <td><span class="status-pill ${r.Status}">${r.Status}</span></td>
          <td class="ta-right">${actions}</td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('button[data-action="approve"], button[data-action="reject"]').forEach(btn => {
      btn.addEventListener('click', () => decideRequest(btn.dataset.id, btn.dataset.action, tool, roleLabel));
    });
    tbody.querySelectorAll('button[data-action="approve-group"], button[data-action="reject-group"]').forEach(btn => {
      const decision = btn.dataset.action === 'approve-group' ? 'approve' : 'reject';
      btn.addEventListener('click', () => decideRequestGroup(btn.dataset.groupId, decision, tool, roleLabel));
    });
    tbody.querySelectorAll('button[data-tl-upload-id]').forEach(btn => {
      btn.addEventListener('click', () => triggerTeamLeaveUpload(btn.dataset.tlUploadId, tool, roleLabel));
    });
  }

  // Ανέβασμα δικαιολογητικού αναρρωτικής από τον TL/Director (πίνακας
  // «Αιτήσεις άδειας» του tab Άδειες Ομάδας/Team Leaders) — ίδιο μοτίβο με
  // triggerLeaveUpload()/uploadLeaveFile() του «Οι Άδειές μου», απλά με
  // δικό του hidden file input (tl-file-input) και re-render στο σωστό tab.
  function triggerTeamLeaveUpload(requestId, tool, roleLabel) {
    const input = document.getElementById('tl-file-input');
    input.value = '';
    input.onchange = () => {
      if (input.files && input.files[0]) uploadTeamLeaveFile(requestId, input.files[0], tool, roleLabel);
    };
    input.click();
  }

  async function uploadTeamLeaveFile(requestId, file, tool, roleLabel) {
    if (file.type !== 'application/pdf') {
      alert('Επιτρέπεται μόνο αρχείο PDF.');
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      alert('Το αρχείο είναι πολύ μεγάλο (μέγιστο 20MB).');
      return;
    }
    try {
      const res = await fetch(`/api/leaves/attachment/upload?requestId=${encodeURIComponent(requestId)}&filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': file.type },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία ανεβάσματος.');
      renderTeamLeaves(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

  // Χρησιμοποιείται μέσα στη στήλη «Ημερομηνίες» του πίνακα «Αιτήσεις
  // άδειας» — μόνο για αιτήσεις τύπου Αναρρωτική έχει νόημα. Αν λείπει
  // δικαιολογητικό, δείχνει κουμπί ανεβάσματος (ΕΓΙΝΕ 03/09/2026, ρητή
  // απαίτηση χρήστη) — ο TL/Director μπορεί πλέον να ανεβάσει ο ίδιος το
  // PDF όταν καταχωρεί αναρρωτική εκ μέρους τεχνικού, όχι μόνο ο τεχνικός
  // από το δικό του «Οι Άδειές μου» (backend: uploadLeaveAttachment στο
  // src/leaves.js δέχεται πλέον και TL/Director της αίτησης, μέσω
  // isAuthorizedForTeam — καλύπτει αυτόματα και backup TL όσο "Λείπω").
  function sickAttachmentBadge(l) {
    if (l.Type !== 'Αναρρωτική') return '';
    if (l.FileKey) {
      return `<a href="/api/leaves/attachment?id=${encodeURIComponent(l.ID)}" target="_blank" rel="noopener" style="margin-left:6px;">📄 δικαιολογητικό</a>`;
    }
    return `<button class="btn btn-ghost" data-tl-upload-id="${l.ID}" style="margin-left:6px; padding:2px 8px; font-size:11.5px;">Ανέβασμα PDF</button>`;
  }

  async function decideRequest(requestId, decision, tool, roleLabel) {
    const row = document.querySelector(`tr[data-id="${requestId}"]`);
    if (row) row.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const res = await fetch('/api/leaves/decide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requestId, decision }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία.');
      renderTeamLeaves(tool, roleLabel);
      refreshNavBadges();
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
      renderTeamLeaves(tool, roleLabel);
    }
  }

  // υποβολής (κοινό GroupID) με ΜΙΑ ενέργεια, βλ. renderPending παραπάνω.
  async function decideRequestGroup(groupId, decision, tool, roleLabel) {
    const row = document.querySelector(`tr[data-group-id="${groupId}"]`);
    if (row) row.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const res = await fetch('/api/leaves/decide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupId, decision }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία.');
      renderTeamLeaves(tool, roleLabel);
      refreshNavBadges();

      alert('Σφάλμα: ' + (err.message || err));

  async function submitTeamLeave(tool, roleLabel) {
    const employeeId = document.getElementById('tl-employee').value;
    const type = document.getElementById('tl-type').value;
    const startDate = document.getElementById('tl-start').value;
    const endDate = document.getElementById('tl-end').value;
    const note = document.getElementById('tl-note').value;
    const attachInput = document.getElementById('tl-attach-input');
    const attachFile = (type === LEAVE_SICK_TYPE && attachInput && attachInput.files && attachInput.files[0]) || null;
    const msg = document.getElementById('tl-submit-msg');
    const btn = document.getElementById('tl-submit-btn');

    if (!employeeId) { msg.textContent = 'Επίλεξε τεχνικό.'; msg.className = 'msg err'; return; }
    if (!startDate || !endDate) { msg.textContent = 'Συμπλήρωσε ημερομηνίες.'; msg.className = 'msg err'; return; }
    if (attachFile && attachFile.type !== 'application/pdf') { msg.textContent = 'Το δικαιολογητικό πρέπει να είναι αρχείο PDF.'; msg.className = 'msg err'; return; }
    if (attachFile && attachFile.size > 20 * 1024 * 1024) { msg.textContent = 'Το δικαιολογητικό είναι πολύ μεγάλο (μέγιστο 20MB).'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/leaves/submit-for-team', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeId, type, startDate, endDate, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία υποβολής.');
      let text = `Καταχωρήθηκε (${data.days} ημέρες).`;
      if (attachFile) {
        try {
          await uploadAttachmentSilently(data.requestId, attachFile);
          text += ' Το δικαιολογητικό ανέβηκε.';
        } catch (uploadErr) {
          text += ' Η αίτηση καταχωρήθηκε, αλλά το δικαιολογητικό απέτυχε να ανέβει — δοκίμασε ξανά από τον πίνακα «Αιτήσεις άδειας».';
        }
      }
      msg.textContent = text;
      msg.className = 'msg ok';
      btn.disabled = false;
      renderTeamLeaves(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

    const s = (status || '').toLowerCase();

  // Επίπεδο προειδοποίησης για ημερομηνία ΚΤΕΟ/service: 'ok' | 'warn' (<=30 ημέρες) | 'bad' (έχει λήξει) | 'none' (δεν έχει οριστεί)
  function fleetDateAlertLevel(dateStr) {
    if (!dateStr) return 'none';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return 'none';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays < 0) return 'bad';
    if (diffDays <= 30) return 'warn';
    return 'ok';
  }

  function fleetDateBadge(dateStr) {
    const level = fleetDateAlertLevel(dateStr);
    if (level === 'none') return '<span class="cell-muted">—</span>';
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((d - today) / 86400000);
    if (level === 'bad') return `<span class="status-pill st-bad" title="Έληξε · ${fmtDate(dateStr)}">Έληξε · ${fmtDate(dateStr)}</span>`;
    if (level === 'warn') return `<span class="status-pill st-warn" title="${fmtDate(dateStr)} (${diffDays}ημ.)">${fmtDate(dateStr)} (${diffDays}ημ.)</span>`;
    return `<span class="status-pill st-ok" title="${fmtDate(dateStr)}">${fmtDate(dateStr)}</span>`;
  }

  /** Εμφάνιση ημερομηνίας ΚΤΕΟ/Service στην κάρτα οχήματος (05/09/2026, ρητή απαίτηση χρήστη) — ΧΩΡΙΣ badge/pill φόντο, απλό κείμενο. "Φωτίζεται" (χρωματίζεται/τονίζεται) ΜΟΝΟ όταν απομένουν <=5 ημέρες ή έχει ήδη λήξει· ανεξάρτητο κατώφλι από το γενικό fleetDateAlertLevel() (30 ημέρες, χρησιμοποιείται αλλού — tile Αρχικής/nav badge — και ΔΕΝ αγγίχτηκε). Μόνο για χρήση μέσα σε .fleet-date-item. */
  function fleetDateInline(dateStr) {
    if (!dateStr) return '<span class="cell-muted">—</span>';
    const iso = normalizeDateStr(dateStr);
    const d = iso ? new Date(iso + 'T00:00:00') : null;
    if (!d || isNaN(d)) return '<span class="cell-muted">—</span>';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((d - today) / 86400000);
    const expired = diffDays < 0;
    const near = diffDays >= 0 && diffDays <= 5;
    const cls = expired ? 'fleet-date-bad' : (near ? 'fleet-date-warn' : '');
    const title = expired ? `Έληξε · ${fmtDate(dateStr)}` : (near ? `${fmtDate(dateStr)} (${diffDays}ημ.)` : fmtDate(dateStr));
    return `<span class="fleet-date-plain ${cls}" title="${escapeHtml(title)}">${fmtDate(dateStr)}</span>`;
  }

  /** Ημέρες από μια ημερομηνία μέχρι σήμερα (>=0) — για τον μετρητή "Σε συνεργείο από... · X ημέρες" της κάρτας οχήματος (04/09/2026). null αν η ημερομηνία λείπει/είναι άκυρη. */
  function fleetDaysSince(dateStr) {
    const iso = normalizeDateStr(dateStr);
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((today - d) / 86400000);
    return diff >= 0 ? diff : 0;
  }

  /** Κελί "Ασφάλιση" — εταιρεία + αριθμός συμβολαίου + ημερομηνία ανανέωσης (badge, ίδιο κατώφλι/χρωματισμός με ΚΤΕΟ/Service). Καθαρά πληροφοριακό πεδίο, item #119 (15/08/2026). */
  function fleetInsuranceCell(v) {
    const hasAny = v.InsuranceCompany || v.PolicyNumber || v.InsuranceRenewalDate;
    if (!hasAny) return '<span class="cell-muted">—</span>';
    const lines = [];
    if (v.InsuranceCompany) lines.push(`<div>${v.InsuranceCompany}</div>`);
    if (v.PolicyNumber) lines.push(`<div style="font-size:11px; color:var(--text-faint);">${v.PolicyNumber}</div>`);
    if (v.InsuranceRenewalDate) lines.push(`<div style="margin-top:2px;">${fleetDateBadge(v.InsuranceRenewalDate)}</div>`);
    return lines.join('');
  }

  /** Μορφοποίηση χιλιομέτρων με ελληνικές χιλιάδες (π.χ. 142.350) — καθαρά εμφάνιση, το backend/Sheet κρατάει την ωμή τιμή. */
  function fleetMileageDisplay(v) {
    if (v.CurrentMileage === undefined || v.CurrentMileage === '' || isNaN(Number(v.CurrentMileage))) return null;
    return Number(v.CurrentMileage).toLocaleString('el-GR');
  }

      const serviceDays = (v.Status === 'Σε service' && v.ServiceEnteredAt) ? fleetDaysSince(v.ServiceEnteredAt) : null;
      return `
      <div class="fleet-card" data-id="${v.ID}">

  function editFleetVehicle(vehicleId, vehicles, tool, roleLabel) {
    const v = vehicles.find(x => x.ID === vehicleId);
    if (!v) return;
    FLEET_EDIT_ID = vehicleId;
    document.getElementById('fl-modal-title').textContent = 'Επεξεργασία οχήματος';
    document.getElementById('fl-add-btn').textContent = 'Αποθήκευση αλλαγών';
    document.getElementById('fl-plate').value = v.Plate || '';
    const typeSelect = document.getElementById('fl-type-select');
    const typeOther = document.getElementById('fl-type-other');
    if (v.Type && !FLEET_TYPES.includes(v.Type)) {
      typeSelect.value = '__other__';
      typeOther.value = v.Type;
      typeOther.style.display = '';
    } else {
      typeSelect.value = v.Type || '';
      typeOther.value = '';
      typeOther.style.display = 'none';
    }
    document.getElementById('fl-assigned').value = v.AssignedTo || '';
    document.getElementById('fl-status').value = v.Status || 'Ενεργό';
    document.getElementById('fl-kteo').value = v.KteoDate || '';
    document.getElementById('fl-service').value = v.ServiceDate || '';
    document.getElementById('fl-deductible').value = v.Deductible || '';
    document.getElementById('fl-mileage').value = v.CurrentMileage || '';
    document.getElementById('fl-insurance-company').value = v.InsuranceCompany || '';
    document.getElementById('fl-policy-number').value = v.PolicyNumber || '';
    document.getElementById('fl-insurance-renewal').value = v.InsuranceRenewalDate || '';

    msg.textContent = ''; msg.className = 'msg';
    document.getElementById('fl-add-btn').disabled = false;
    openModal('fl-add-modal');

  async function submitFleetVehicleForm(tool, roleLabel) {
    const plate = document.getElementById('fl-plate').value.trim();
    const typeSelectVal = document.getElementById('fl-type-select').value;
    const type = typeSelectVal === '__other__' ? document.getElementById('fl-type-other').value.trim() : typeSelectVal;
    const assignedTo = document.getElementById('fl-assigned').value.trim();
    const status = document.getElementById('fl-status').value;
    const serviceNote = document.getElementById('fl-note').value.trim();
    const kteoDate = document.getElementById('fl-kteo').value;
    const serviceDate = document.getElementById('fl-service').value;
    const deductible = document.getElementById('fl-deductible').value;
    const currentMileage = document.getElementById('fl-mileage').value;
    const insuranceCompany = document.getElementById('fl-insurance-company').value.trim();
    const policyNumber = document.getElementById('fl-policy-number').value.trim();
    const insuranceRenewalDate = document.getElementById('fl-insurance-renewal').value;
    const msg = document.getElementById('fl-add-msg');
    const btn = document.getElementById('fl-add-btn');

    if (!plate) { msg.textContent = 'Χρειάζεται πινακίδα.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    const isEdit = !!FLEET_EDIT_ID;
    const url = isEdit ? '/api/fleet/update' : '/api/fleet/add';
    const payload = { plate, type, assignedTo, status, serviceNote, kteoDate, serviceDate, deductible, currentMileage, insuranceCompany, policyNumber, insuranceRenewalDate };
    if (isEdit) payload.vehicleId = FLEET_EDIT_ID;

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία αποθήκευσης.');
      closeModal('fl-add-modal');
      renderFleet(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  async function deleteFleetVehicle(vehicleId, tool, roleLabel) {
    if (!confirm('Σίγουρα διαγραφή αυτού του οχήματος;')) return;
    try {
      const res = await fetch('/api/fleet/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vehicleId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία διαγραφής.');
      renderFleet(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

    try {
      const res = await fetch('/api/fleet/accidents?' + new URLSearchParams({ vehicleId }).toString());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία φόρτωσης.');
      msg.textContent = ''; msg.className = 'msg';

      const accidents = data.accidents || [];
      const driverOptions = ['<option value="">— (χωρίς οδηγό) —</option>']

      resultsEl.innerHTML = `
        <div class="card" style="margin-top:10px;">

            <tbody>${accidents.length ? accidents.map(a => `
              <tr>
                <td>${fmtDate(a.Date)}</td>
                <td>${a.EmployeeName || '—'}</td>
                <td>${a.Comments || '—'}</td>
                <td>${a.FileName ? `<a href="/api/fleet/accident/attachment?accidentId=${a.ID}" target="_blank">${a.FileName}</a>` : '<span class="cell-muted">—</span>'}</td>
              </tr>
            `).join('') : '<tr><td colspan="4" class="empty">Κανένα ατύχημα καταγεγραμμένο</td></tr>'}</tbody>
          </table>
        </div>

        <div class="card">
          <div class="card-title" style="font-size:13px; margin-top:14px;">Καταγραφή νέου ατυχήματος</div>
          <div class="form-grid">
            <div class="field"><label>Ημερομηνία</label><input type="date" id="acc-date"></div>
            <div class="field"><label>Οδηγός (τη στιγμή του ατυχήματος)</label><select id="acc-driver">${driverOptions}</select></div>
            <div class="field full"><label>Σχόλια</label><input type="text" id="acc-comments" placeholder="Περιγραφή συμβάντος..."></div>

          </div>

            <button class="btn btn-primary" id="acc-submit-btn">Καταγραφή ατυχήματος</button>
            <span class="msg" id="acc-submit-msg"></span>
          </div>
        </div>
      `;
      document.getElementById('acc-submit-btn').addEventListener('click', () => submitVehicleAccident(vehicleId));
    } catch (err) {
      resultsEl.innerHTML = '';
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
    }
  }

  async function submitVehicleAccident(vehicleId) {
    const date = document.getElementById('acc-date').value;
    const employeeId = document.getElementById('acc-driver').value;
    const comments = document.getElementById('acc-comments').value.trim();
    const file = document.getElementById('acc-file').files[0] || null;
    const msg = document.getElementById('acc-submit-msg');
    const btn = document.getElementById('acc-submit-btn');

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/fleet/accident', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vehicleId, employeeId, date, comments }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία καταγραφής.');

      if (file) {
        const upRes = await fetch(`/api/fleet/accident/attachment/upload?accidentId=${encodeURIComponent(data.accident.ID)}&filename=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file,
        });
        const upData = await upRes.json();
        if (!upRes.ok) throw new Error(upData.error || 'Το ατύχημα καταγράφηκε, αλλά απέτυχε το ανέβασμα του συνημμένου.');
      }

      loadVehicleAccidents();
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  async function createHandoverDocumentUi(employeeId) {
    const msg = document.getElementById('hd-create-msg');

    btn.disabled = true;
    msg.textContent = 'Δημιουργία...'; msg.className = 'msg';

  async function addEquipmentItem(tool, roleLabel) {
    const name = document.getElementById('eq-name').value.trim();
    const catSelectVal = document.getElementById('eq-category-select').value;
    const category = catSelectVal === '__other__' ? document.getElementById('eq-category-other').value.trim() : catSelectVal;
    const serialNumber = document.getElementById('eq-serial').value.trim();
    const model = document.getElementById('eq-model').value.trim();
    const imei = document.getElementById('eq-imei').value.trim();
    const assignedTo = document.getElementById('eq-assigned').value.trim();
    const status = document.getElementById('eq-status').value;
    const note = document.getElementById('eq-note').value.trim();
    const msg = document.getElementById('eq-add-msg');
    const btn = document.getElementById('eq-add-btn');

    if (!name) { msg.textContent = 'Χρειάζεται όνομα αντικειμένου.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/equipment/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, category, assignedTo, status, note, serialNumber, model, imei }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία προσθήκης.');
      renderEquipment(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  function editEquipmentItem(itemId, items, tool, roleLabel) {
    const v = items.find(x => x.ID === itemId);
    if (!v) return;
    const row = document.querySelector(`tr[data-id="${itemId}"]`);
    if (!row) return;
    const driverOptions = ['<option value="">— Κανένας —</option>']
      .concat(EQUIPMENT_DRIVERS.map(d => `<option value="${d.Name}"${v.AssignedTo === d.Name ? ' selected' : ''}>${d.Name}</option>`))
      .join('');
    const statuses = ['Διαθέσιμο', 'Σε χρήση', 'Εκτός λειτουργίας'];
    const statusOptions = statuses.map(s => `<option${v.Status === s ? ' selected' : ''}>${s}</option>`).join('');
    const categoryOptions = ['<option value="">— (καμία) —</option>']
      .concat(EQUIPMENT_CATEGORIES.map(c => `<option value="${c}"${v.Category === c ? ' selected' : ''}>${c}</option>`))
      .concat(['<option value="__other__">Άλλη κατηγορία...</option>'])
      .join('');
    row.innerHTML = `
      <td class="fl-edit"><input type="text" value="${v.Name}" id="ed-eq-name"></td>
      <td class="fl-edit">
        <select id="ed-eq-category-select">${categoryOptions}</select>
        <input type="text" id="ed-eq-category-other" placeholder="Νέα κατηγορία" style="display:none; margin-top:4px;">
      </td>
      <td class="fl-edit"><input type="text" value="${escapeHtml(v.SerialNumber)}" id="ed-eq-serial" placeholder="Σειριακός Αριθμός"></td>
      <td class="fl-edit"><input type="text" value="${escapeHtml(v.Model)}" id="ed-eq-model" placeholder="Μοντέλο"></td>
      <td class="fl-edit"><input type="text" value="${escapeHtml(v.IMEI)}" id="ed-eq-imei" placeholder="IMEI"></td>
      <td class="fl-edit"><select id="ed-eq-assigned">${driverOptions}</select></td>
      <td class="fl-edit"><select id="ed-eq-status">${statusOptions}</select></td>
      <td class="fl-edit"><input type="text" value="${escapeHtml(v.Note)}" id="ed-eq-note"></td>
      <td class="fl-actions" colspan="2">
        <button class="icon-btn icon-btn-sq" data-action="save" title="Αποθήκευση" aria-label="Αποθήκευση"><i class="ti ti-check"></i></button>
        <button class="icon-btn icon-btn-sq" data-action="cancel" title="Άκυρο" aria-label="Άκυρο"><i class="ti ti-x"></i></button>
      </td>
    `;
    document.getElementById('ed-eq-category-select').addEventListener('change', (e) => {
      document.getElementById('ed-eq-category-other').style.display = e.target.value === '__other__' ? '' : 'none';
    });
    row.querySelector('[data-action="save"]').addEventListener('click', () => saveEquipmentItem(itemId, tool, roleLabel));
    row.querySelector('[data-action="cancel"]').addEventListener('click', () => renderEquipment(tool, roleLabel));
  }

  async function saveEquipmentItem(itemId, tool, roleLabel) {
    const name = document.getElementById('ed-eq-name').value.trim();
    const catSelectVal = document.getElementById('ed-eq-category-select').value;
    const category = catSelectVal === '__other__' ? document.getElementById('ed-eq-category-other').value.trim() : catSelectVal;

    const assignedTo = document.getElementById('ed-eq-assigned').value.trim();
    const status = document.getElementById('ed-eq-status').value;
    const note = document.getElementById('ed-eq-note').value.trim();

    try {
      const res = await fetch('/api/equipment/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId, name, category, assignedTo, status, note, serialNumber, model, imei }),
      });

          <span class="msg" id="tw-msg"></span>
        </div>
      </div>
    `;

    document.getElementById('tw-add-date-btn').addEventListener('click', twAddDate);
    document.getElementById('tw-submit-btn').addEventListener('click', () => submitTelework(tool, roleLabel));
  }

  function twAddDate() {
    const input = document.getElementById('tw-date-input');
    const val = input.value;
    if (!val) return;
    if (!TELEWORK_DATES.includes(val)) {
      TELEWORK_DATES.push(val);
      TELEWORK_DATES.sort();
    }
    input.value = '';
    twRenderDates();
  }

  function twRemoveDate(date) {
    TELEWORK_DATES = TELEWORK_DATES.filter(d => d !== date);
    twRenderDates();
  }

  function twRenderDates() {
    const el = document.getElementById('tw-dates-list');
    if (!TELEWORK_DATES.length) {
      el.innerHTML = '<span class="empty">Καμία ημερομηνία ακόμα</span>';
      return;
    }
    el.innerHTML = TELEWORK_DATES.map(d => `
      <span style="display:inline-flex; align-items:center; gap:6px; background:var(--accent-bg); color:var(--accent-dark); border:1px solid var(--accent-line); padding:5px 10px; border-radius:100px; font-size:12.5px; font-weight:600;">
        ${fmtDate(d)}
        <button data-date="${d}" style="border:none; background:transparent; color:var(--accent-dark); cursor:pointer; font-weight:700; padding:0; line-height:1;">×</button>
      </span>
    `).join('');
    el.querySelectorAll('button[data-date]').forEach(btn => {
      btn.addEventListener('click', () => twRemoveDate(btn.dataset.date));
    });
  }

  async function submitTelework(tool, roleLabel) {
    const note = document.getElementById('tw-note').value;
    const msg = document.getElementById('tw-msg');
    const btn = document.getElementById('tw-submit-btn');

    if (!TELEWORK_DATES.length) { msg.textContent = 'Πρόσθεσε τουλάχιστον μία ημερομηνία.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/leaves/telework', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dates: TELEWORK_DATES, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία υποβολής.');
      msg.textContent = `Υποβλήθηκαν ${data.count} ημέρες τηλεργασίας — στάλθηκε στον team leader.`;
      msg.className = 'msg ok';
      btn.disabled = false;
      TELEWORK_DATES = [];
      twRenderDates();
      document.getElementById('tw-note').value = '';
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }

  // ============================================================
  // Ψηφιακή υπογραφή — «Έγγραφα προς υπογραφή» (μόνο τεχνικός, tab «Στην
  // Κατοχή μου»). Ο TL/Director δημιουργεί το έγγραφο (βλ. Εξοπλισμός ->
  // Αναζήτηση τεχνικού, exportHandoverPdf/loadHandoverDocsForSearch
  // παραπάνω) — εδώ ο τεχνικός το βλέπει και υπογράφει με το δάχτυλο σε
  // canvas, από όποια συσκευή θέλει, χωρίς να χρειάζεται να είναι δίπλα
  // στον TL (βλ. src/handover.js για το πλήρες σκεπτικό).
  // ============================================================

  async function loadMyHandoverDocuments() {
    const area = document.getElementById('handover-my-area');
    if (!area) return;
    try {
      const res = await fetch('/api/handover/my');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία φόρτωσης.');
      renderMyHandoverDocuments(area, data.documents || []);
    } catch (err) {
      area.innerHTML = `<div class="msg err">Σφάλμα εγγράφων προς υπογραφή: ${err.message || err}</div>`;
    }
  }

  function renderMyHandoverDocuments(area, documents) {
    if (!documents.length) { area.innerHTML = ''; return; }
    const pending = documents.filter(d => d.Status !== 'Υπογεγραμμένο');
    const signed = documents.filter(d => d.Status === 'Υπογεγραμμένο');

    area.innerHTML = `
      <div class="card">
        <div class="card-title">Έγγραφα προς υπογραφή</div>

            <div>

              <div class="cell-muted" style="font-size:12px; margin-top:2px;">${d.holdings.map(h => h.ItemLabel).filter(Boolean).join(', ') || '—'}</div>
            </div>
            <button class="btn btn-primary" data-action="sign-handover" data-id="${d.ID}">Υπογραφή</button>
          </div>
        `).join('') : ''}
        ${signed.length ? `<div style="${pending.length ? 'margin-top:14px;' : ''}">
          ${signed.map(d => `
            <div style="padding:6px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <div>Υπογεγραμμένο ${fmtDate(d.SignedAt)} — ${d.holdings.length} αντικείμενα</div>
              <button class="icon-btn" data-action="view-my-handover" data-id="${d.ID}">Προβολή/Εκτύπωση</button>
            </div>

        <div id="handover-sign-area"></div>
      </div>
    `;
    area.querySelectorAll('button[data-action="sign-handover"]').forEach(btn => {
      const doc = documents.find(d => d.ID === btn.dataset.id);
      if (doc) btn.addEventListener('click', () => showHandoverSignForm(doc));
    });
    area.querySelectorAll('button[data-action="view-my-handover"]').forEach(btn => {
      const doc = documents.find(d => d.ID === btn.dataset.id);
      if (doc) btn.addEventListener('click', () => exportHandoverPdf(doc));

  function showHandoverSignForm(doc) {
    const signArea = document.getElementById('handover-sign-area');
    signArea.innerHTML = `
      <div class="section-title" style="font-size:13px; margin-top:16px;">Υπογραφή εγγράφου (${doc.holdings.length} αντικείμενα)</div>
      <div style="border:1px solid var(--line); border-radius:8px; overflow:hidden; touch-action:none; max-width:360px;">
        <canvas id="hd-sign-canvas" width="340" height="140" style="display:block; width:100%; background:#fff; cursor:crosshair;"></canvas>
      </div>
      <div class="form-actions" style="margin-top:8px;">
        <button class="btn btn-primary" id="hd-sign-submit-btn">Υποβολή υπογραφής</button>
        <button class="btn btn-ghost" id="hd-sign-clear-btn">Καθαρισμός</button>
        <button class="btn btn-ghost" id="hd-sign-cancel-btn">Άκυρο</button>
        <span class="msg" id="hd-sign-msg"></span>
      </div>
    `;
    setupSignatureCanvas('hd-sign-canvas');
    document.getElementById('hd-sign-clear-btn').addEventListener('click', () => clearSignatureCanvas('hd-sign-canvas'));
    document.getElementById('hd-sign-cancel-btn').addEventListener('click', () => { signArea.innerHTML = ''; });
    document.getElementById('hd-sign-submit-btn').addEventListener('click', () => submitHandoverSignature(doc.ID));
    signArea.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Απλό canvas drawing (mouse + touch) για την υπογραφή — καμία εξωτερική
  // βιβλιοθήκη, ίδιο "no external libraries" convention με τα υπόλοιπα
  // custom UI στοιχεία του portal.
  const SIGNATURE_CANVAS_STATE = {};

  function setupSignatureCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1B2333';
    SIGNATURE_CANVAS_STATE[canvasId] = { drawing: false, hasInk: false };

    const pos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const point = e.touches && e.touches.length ? e.touches[0] : e;
      return { x: (point.clientX - rect.left) * scaleX, y: (point.clientY - rect.top) * scaleY };
    };
    const start = (e) => {
      e.preventDefault();
      SIGNATURE_CANVAS_STATE[canvasId].drawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };
    const move = (e) => {
      const state = SIGNATURE_CANVAS_STATE[canvasId];
      if (!state || !state.drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      state.hasInk = true;
    };
    const end = () => {
      const state = SIGNATURE_CANVAS_STATE[canvasId];
      if (state) state.drawing = false;
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  function clearSignatureCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (SIGNATURE_CANVAS_STATE[canvasId]) SIGNATURE_CANVAS_STATE[canvasId].hasInk = false;
  }

  async function submitHandoverSignature(docId) {
    const canvasId = 'hd-sign-canvas';
    const canvas = document.getElementById(canvasId);
    const state = SIGNATURE_CANVAS_STATE[canvasId];
    const msg = document.getElementById('hd-sign-msg');
    const btn = document.getElementById('hd-sign-submit-btn');

    if (!state || !state.hasInk) { msg.textContent = 'Σχεδίασε την υπογραφή σου πρώτα.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    canvas.toBlob(async (blob) => {
      if (!blob) { msg.textContent = 'Αποτυχία δημιουργίας εικόνας.'; msg.className = 'msg err'; btn.disabled = false; return; }
      try {
        const res = await fetch(`/api/handover/sign?id=${encodeURIComponent(docId)}&filename=ypografi.png`, {
          method: 'POST',
          headers: { 'Content-Type': 'image/png' },
          body: blob,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Αποτυχία υποβολής υπογραφής.');
        document.getElementById('handover-sign-area').innerHTML = '';
        loadMyHandoverDocuments();
      } catch (err) {
        msg.textContent = 'Σφάλμα: ' + (err.message || err);
        msg.className = 'msg err';
        btn.disabled = false;
      }
    }, 'image/png');
  }

  /** Σύνδεσμοι λήψης/προβολής φωτογραφιών παραλαβής — ίδιο endpoint (session-based, owner ή TL/Director), ανοίγει σε νέα καρτέλα.
   * Όταν υπάρχουν 2+ φωτογραφίες, προστίθεται και «Λήψη όλων» (ρητή απαίτηση χρήστη) — απλό άνοιγμα ΟΛΩΝ σε νέες
   * καρτέλες με ένα κλικ (window.open loop, βλ. delegated listener παρακάτω), ΟΧΙ πραγματικό zip: αποφασίστηκε ρητά να
   * μείνει έτσι (καμία νέα εξωτερική βιβλιοθήκη, μικρός αριθμός φωτογραφιών ανά χρέωση, χρήση κυρίως από TL/Director σε
   * desktop) — αν χρειαστεί ποτέ πραγματικό zip, να ξαναζητηθεί ρητά. */
  function pickupPhotosLinksHtml(chargeId, photosJson) {
    let photos = [];
    try { photos = photosJson ? JSON.parse(photosJson) : []; } catch {}
    if (!Array.isArray(photos) || !photos.length) return '';
    const urls = photos.map((p) => '/api/charges/pickup/photo?' + new URLSearchParams({ chargeId, fileKey: p.fileKey }).toString());
    const links = urls.map((url, i) => `<a href="${url}" target="_blank" rel="noopener">Φωτό ${i + 1}</a>`).join(' · ');
    if (urls.length < 2) return links;
    const dataUrls = encodeURIComponent(JSON.stringify(urls));
    return `${links} · <a href="#" class="download-all-photos" data-urls="${dataUrls}">Λήψη όλων</a>`;
  }

  /** Delegated listener για το «Λήψη όλων» παραπάνω — καλύπτει ΟΛΑ τα σημεία που καλούν pickupPhotosLinksHtml
   * (ενεργές χρεώσεις, ιστορικό χρεώσεων, Προφίλ Τεχνικού, Αναζήτηση τεχνικού στο Εξοπλισμός) χωρίς να χρειάζεται
   * ξεχωριστό wiring μετά από κάθε innerHTML render. */
  document.addEventListener('click', (e) => {
    const link = e.target.closest('.download-all-photos');
    if (!link) return;
    e.preventDefault();
    let urls = [];
    try { urls = JSON.parse(decodeURIComponent(link.dataset.urls)); } catch {}
    urls.forEach((u) => window.open(u, '_blank', 'noopener'));
  });

  /** Σύνδεσμος φωτογραφίας κοντέρ (κοντέρ παραλαβής/επιστροφής) — ξεχωριστό υποχρεωτικό πεδίο, item #1 «Προς Συζήτηση» (15/08/2026). Ίδιο endpoint session-based (owner ή TL/Director) με τις γενικές φωτογραφίες. */
  function odometerPhotoLinkHtml(chargeId, which, hasKey) {
    if (!hasKey) return '';
    const url = '/api/charges/odometer-photo?' + new URLSearchParams({ chargeId, which }).toString();
    return `<a href="${url}" target="_blank" rel="noopener">Φωτό κοντέρ</a>`;
  }

  /** Κελί "Παραλαβή" στη λίστα ενεργών χρεώσεων — μόνο για οχήματα (ρητή απόφαση χρήστη, ο τεχνικός συμπληρώνει μόνος του χιλιόμετρα+φωτογραφίες όταν παραλαμβάνει) */
  function chargePickupCell(x) {
    if (x.Type !== 'Όχημα') return '<span class="cell-muted">—</span>';
    if (x.PickupMileage) {
      const links = [pickupPhotosLinksHtml(x.ID, x.PickupPhotos), odometerPhotoLinkHtml(x.ID, 'pickup', x.OdometerPickupPhotoKey)].filter(Boolean).join(' · ');
      return `<div>${x.PickupMileage} χλμ</div>${links ? `<div style="font-size:11.5px; margin-top:2px;">${links}</div>` : ''}`;
    }
    return `<button class="icon-btn" data-action="record-pickup" data-id="${x.ID}">Καταγραφή παραλαβής</button>`;
  }

  /** Κελί "Επιστροφή" στη λίστα ενεργών χρεώσεων — ρητή απαίτηση χρήστη: ο ίδιος ο τεχνικός καταγράφει χιλιόμετρα και όταν επιστρέφει το όχημα, όποτε συμβεί αυτό */
  function chargeReturnCell(x) {
    if (x.Type !== 'Όχημα' || !x.PickupMileage) return '<span class="cell-muted">—</span>';
    if (x.ReturnMileage) {
      const driven = Number(x.ReturnMileage) - Number(x.PickupMileage);
      const odo = odometerPhotoLinkHtml(x.ID, 'return', x.OdometerReturnPhotoKey);
      return `<div>${x.ReturnMileage} χλμ${!isNaN(driven) && driven >= 0 ? ` <span class="cell-muted">(${driven} διαδρομή)</span>` : ''}</div>${odo ? `<div style="font-size:11.5px; margin-top:2px;">${odo}</div>` : ''}`;
    }
    return `<button class="icon-btn" data-action="record-return" data-id="${x.ID}">Καταγραφή επιστροφής</button>`;
  }

  /** Κελιά "Παραλαβή"/"Επιστροφή"/"Απαλλαγή" στο Ιστορικό χρεώσεων — read-only εκδοχές, ίδια δεδομένα */
  function chargeHistoryPickupCell(x) {
    if (x.Type !== 'Όχημα' || !x.PickupMileage) return '<span class="cell-muted">—</span>';
    const links = [pickupPhotosLinksHtml(x.ID, x.PickupPhotos), odometerPhotoLinkHtml(x.ID, 'pickup', x.OdometerPickupPhotoKey)].filter(Boolean).join(' · ');
    return `<div>${x.PickupMileage} χλμ</div>${links ? `<div style="font-size:11.5px; margin-top:2px;">${links}</div>` : ''}`;
  }

  function chargeHistoryReturnCell(x) {
    if (x.Type !== 'Όχημα' || !x.ReturnMileage) return '<span class="cell-muted">—</span>';
    const odo = odometerPhotoLinkHtml(x.ID, 'return', x.OdometerReturnPhotoKey);
    return `<div>${x.ReturnMileage} χλμ</div>${odo ? `<div style="font-size:11.5px; margin-top:2px;">${odo}</div>` : ''}`;
  }

  function chargeDeductibleCell(x) {
    if (x.Type !== 'Όχημα' || x.Deductible === undefined || x.Deductible === '') return '<span class="cell-muted">—</span>';
    return `€${x.Deductible}`;
  }

  function showPickupForm(chargeId, tool, roleLabel) {
    const area = document.getElementById('pickup-form-area');
    area.innerHTML = `
      <div class="card">
        <div class="card-title" style="font-size:13px;">Καταγραφή παραλαβής οχήματος</div>
        <div class="form-grid">
          <div class="field">
            <label>Χιλιόμετρα παραλαβής</label>
            <input type="number" id="pu-mileage" min="0" step="1" placeholder="π.χ. 84250">
          </div>
          <div class="field">
            <label>Φωτογραφία κοντέρ (χιλιομετρητή) *</label>
            <input type="file" id="pu-odometer-photo" accept="image/*">
          </div>
          <div class="field">
            <label>Φωτογραφίες παραλαβής (μπορείς να επιλέξεις πολλές)</label>
            <input type="file" id="pu-photos" accept="image/*" multiple>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="pu-submit-btn">Καταχώρηση</button>
          <button class="btn btn-ghost" id="pu-cancel-btn">Άκυρο</button>
          <span class="msg" id="pu-msg"></span>
        </div>
      </div>
    `;
    document.getElementById('pu-cancel-btn').addEventListener('click', () => { area.innerHTML = ''; });
    document.getElementById('pu-submit-btn').addEventListener('click', () => submitVehiclePickup(chargeId, tool, roleLabel));
    area.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function submitVehiclePickup(chargeId, tool, roleLabel) {
    const mileage = document.getElementById('pu-mileage').value;
    const odometerFile = document.getElementById('pu-odometer-photo').files[0];
    const files = Array.from(document.getElementById('pu-photos').files || []);
    const msg = document.getElementById('pu-msg');
    const btn = document.getElementById('pu-submit-btn');

    if (!mileage) { msg.textContent = 'Χρειάζεται τιμή χιλιομέτρων.'; msg.className = 'msg err'; return; }
    if (!odometerFile) { msg.textContent = 'Χρειάζεται φωτογραφία κοντέρ.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/charges/pickup/mileage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chargeId, mileage }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία καταγραφής χιλιομέτρων.');

      const odoRes = await fetch(`/api/charges/pickup/odometer-photo/upload?chargeId=${encodeURIComponent(chargeId)}&filename=${encodeURIComponent(odometerFile.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': odometerFile.type || 'application/octet-stream' },
        body: odometerFile,
      });
      const odoData = await odoRes.json();
      if (!odoRes.ok) throw new Error(odoData.error || 'Αποτυχία ανεβάσματος φωτογραφίας κοντέρ.');

      const photoFailures = [];
      for (const file of files) {
        try {
          const upRes = await fetch(`/api/charges/pickup/photo/upload?chargeId=${encodeURIComponent(chargeId)}&filename=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            headers: { 'Content-Type': file.type || 'application/octet-stream' },
            body: file,
          });
          const upData = await upRes.json();
          if (!upRes.ok) throw new Error(upData.error || 'Αποτυχία ανεβάσματος.');
        } catch (err) {
          photoFailures.push(file.name);
        }
      }

      if (photoFailures.length) {
        msg.textContent = `Καταγράφηκε, αλλά απέτυχε το ανέβασμα: ${photoFailures.join(', ')}`;
        msg.className = 'msg err';
      }
      document.getElementById('pickup-form-area').innerHTML = '';
      renderCharges(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  /** Φόρμα καταγραφής επιστροφής οχήματος — ρητή απαίτηση χρήστη: ο ίδιος ο τεχνικός τη συμπληρώνει όποτε επιστρέφει φυσικά το όχημα (ίδιο σημείο με την παραλαβή, μόνο χιλιόμετρα) */
  function showReturnForm(chargeId, tool, roleLabel) {
    const area = document.getElementById('pickup-form-area');
    area.innerHTML = `
      <div class="card">
        <div class="card-title" style="font-size:13px;">Καταγραφή επιστροφής οχήματος</div>
        <div class="form-grid">
          <div class="field">
            <label>Χιλιόμετρα επιστροφής</label>
            <input type="number" id="rt-mileage" min="0" step="1" placeholder="π.χ. 84610">

  async function submitVehicleReturn(chargeId, tool, roleLabel) {
    const mileage = document.getElementById('rt-mileage').value;
    const odometerFile = document.getElementById('rt-odometer-photo').files[0];
    const msg = document.getElementById('rt-msg');
    const btn = document.getElementById('rt-submit-btn');

    if (!mileage) { msg.textContent = 'Χρειάζεται τιμή χιλιομέτρων.'; msg.className = 'msg err'; return; }
    if (!odometerFile) { msg.textContent = 'Χρειάζεται φωτογραφία κοντέρ.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/charges/pickup/return-mileage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chargeId, mileage }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία καταγραφής χιλιομέτρων.');

      const odoRes = await fetch(`/api/charges/return/odometer-photo/upload?chargeId=${encodeURIComponent(chargeId)}&filename=${encodeURIComponent(odometerFile.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': odometerFile.type || 'application/octet-stream' },
        body: odometerFile,
      });
      const odoData = await odoRes.json();
      if (!odoRes.ok) throw new Error(odoData.error || 'Αποτυχία ανεβάσματος φωτογραφίας κοντέρ.');

      document.getElementById('pickup-form-area').innerHTML = '';
      renderCharges(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  // αποθήκευση σύνθεσης ανά ημέρα με ιστορικό. Η επεξεργασία επιτρέπεται

  function todayStr() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  async function renderCrews(tool, roleLabel) {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.innerHTML = loadingBarHtml('Φόρτωση...');

    CREWS_TODAY = todayStr();
    if (!CREWS_DATE) CREWS_DATE = CREWS_TODAY;

    try {
      const [poolRes, datesRes] = await Promise.all([
        fetch('/api/crews/pool'),
        fetch('/api/crews/dates'),
      ]);
      const poolData = await poolRes.json();
      const datesData = await datesRes.json();
      if (!poolRes.ok) throw new Error(poolData.error || 'Σφάλμα φόρτωσης δεξαμενής.');
      if (!datesRes.ok) throw new Error(datesData.error || 'Σφάλμα φόρτωσης ιστορικού.');
      CREWS_POOL = poolData.technicians || [];
      CREWS_SAVED_DATES = datesData.dates || [];
      await crewsLoadDate(CREWS_DATE);
    } catch (err) {
      content.className = 'err';
      content.textContent = 'Σφάλμα: ' + (err.message || err);
      return;
    }

    content.className = '';
    crewsRenderBoard(tool, roleLabel);
  }

  async function crewsLoadDate(date) {
    const res = await fetch('/api/crews?date=' + encodeURIComponent(date));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Σφάλμα φόρτωσης σύνθεσης.');
    CREWS_DATA = Array.isArray(data.crews) ? data.crews : [];
    CREWS_READONLY = date !== CREWS_TODAY;
    // Ιστορικό (ημέρα != σήμερα): δείξε το "παγωμένο" στιγμιότυπο κατάστασης
    // όπως αποθηκεύτηκε εκείνη τη στιγμή, όχι τη ζωντανή σημερινή κατάσταση.
    CREWS_SNAPSHOT_TECHS = CREWS_READONLY && Array.isArray(data.technicians) && data.technicians.length
      ? data.technicians
      : null;
  }

  /** Ζωντανή δεξαμενή (σήμερα, επεξεργάσιμο) ή παγωμένο στιγμιότυπο (ιστορικό, read-only) */
  function crewsTechSource() {
    return CREWS_READONLY && CREWS_SNAPSHOT_TECHS ? CREWS_SNAPSHOT_TECHS : CREWS_POOL;
  }

  /** Ομαδοποίηση ανά Team, ίδια λογική/σειρά με το Διαθεσιμότητα Τεχνικών ("Χωρίς ομάδα" πάντα τελευταία) */
  function crewsGroupByTeam(list) {
    const groups = new Map();
    list.forEach((t) => {
      const key = t.Team || 'Χωρίς ομάδα';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    const teamNames = Array.from(groups.keys()).sort((a, b) => {
      if (a === 'Χωρίς ομάδα') return 1;
      if (b === 'Χωρίς ομάδα') return -1;
      return a.localeCompare(b, 'el');
    });
    return teamNames.map((team) => ({ team, technicians: groups.get(team) }));
  }

  function crewsAssignedIds() {
    const ids = new Set();
    CREWS_DATA.forEach((c) => (c.memberIds || []).forEach((id) => ids.add(String(id))));
    return ids;
  }

  function crewsTechById(id) {
    return crewsTechSource().find((t) => String(t.EmployeeID) === String(id));
  }

  /** Μέλη ενός συνεργείου, αλφαβητικά (ρητή απαίτηση χρήστη, item #1, 13/08/2026) — η σειρά αποθήκευσης στο
   * memberIds (drag & drop σειρά) παραμένει ως έχει, η αλφαβητική σειρά είναι ΜΟΝΟ για την προβολή εδώ. */
  function crewsSortedMembers(memberIds) {
    return (memberIds || [])
      .map((id) => crewsTechById(id))
      .filter(Boolean)
      .sort((a, b) => a.Name.localeCompare(b.Name, 'el'));
  }

  function crewsStatusPill(t) {
    if (!t) return '';
    if (t.status === 'onleave') return `<span class="status-pill st-bad">${t.statusLabel}</span>`;
    if (t.status === 'soon-leave') return `<span class="status-pill st-warn">${t.statusLabel}</span>`;
    return '<span class="status-pill st-ok">Διαθέσιμος</span>';
  }

  // Το Sheet έχει ανομοιόμορφες τιμές ("Ναι"/"ΝΑΙ"/"ναι" κλπ, ανάλογα αν
  // καταχωρήθηκε από τη φόρμα Νέος Τεχνικός ή χειροκίνητα/μαζικά στο
  // Sheet) — normalize πριν τη σύγκριση ώστε να αναγνωρίζονται όλες.
  function isYes(val) {
    return String(val || '').trim()
      .toUpperCase()
      .replace(/Ά/g, 'Α').replace(/Έ/g, 'Ε').replace(/Ή/g, 'Η')
      .replace(/Ί/g, 'Ι').replace(/Ό/g, 'Ο').replace(/Ύ/g, 'Υ').replace(/Ώ/g, 'Ω')
      === 'ΝΑΙ';
  }

  function crewsLicenseBadge(t) {
    const has = isYes(t.HasDrivingLicense);
    return `<span class="lic-badge ${has ? 'lic-yes' : 'lic-no'}" title="${has ? 'Έχει δίπλωμα οδήγησης' : 'Χωρίς δίπλωμα οδήγησης'}">🚗 ${has ? 'Ναι' : 'Όχι'}</span>`;
  }

  function crewsTechCardHtml(t, draggable) {

        <div class="tc-name">${t.Name}</div>
        <div class="tc-meta">${crewsStatusPill(t)}${crewsLicenseBadge(t)}</div>
      </div>

  }

          crewsRenderBoard(tool, roleLabel);
        });

  function crewsWireDragDrop(tool, roleLabel) {
    const content = document.getElementById('content');
    content.querySelectorAll('.tech-card[draggable="true"]').forEach((card) => {
      card.addEventListener('dragstart', () => {
        CREWS_DRAG_ID = card.dataset.emp;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });

    content.querySelectorAll('[data-drop]').forEach((zone) => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (!CREWS_DRAG_ID) return;
        const empId = CREWS_DRAG_ID;
        CREWS_DRAG_ID = null;
        CREWS_DATA.forEach((c) => { c.memberIds = (c.memberIds || []).filter((id) => String(id) !== String(empId)); });
        const target = zone.dataset.drop;
        if (target !== 'pool') {
          const crew = CREWS_DATA.find((c) => c.id === target);
          if (crew) crew.memberIds.push(empId);
        }
        crewsRenderBoard(tool, roleLabel);
      });
    });
  }

  // Best-effort πρόταση κωδικού υπαλλήλου από το ονοματεπώνυμο (πάντα
  // επεξεργάσιμο πριν την υποβολή). Υποθέτει μορφή "Επώνυμο Όνομα" (όπως
  // στο παράδειγμα του SETUP.md) -> αρχικό ονόματος + επώνυμο, π.χ.
  // "Καλαφάτας Ιωάννης" -> "ikalafatas".
  function suggestEmployeeId(fullName) {
    const GREEK_LATIN = {
      'α':'a','ά':'a','β':'b','γ':'g','δ':'d','ε':'e','έ':'e','ζ':'z','η':'i','ή':'i',
      'θ':'th','ι':'i','ί':'i','ϊ':'i','ΐ':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x',
      'ο':'o','ό':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','ύ':'y','ϋ':'y',
      'ΰ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o','ώ':'o',
    };
    const translit = (s) => s.split('').map(c => GREEK_LATIN[c] !== undefined ? GREEK_LATIN[c] : c).join('').replace(/[^a-z0-9]/g, '');
    const parts = (fullName || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return translit(parts[0]);
    const surname = translit(parts[0]);
    const firstInitial = translit(parts[1]).charAt(0);
    return `${firstInitial}${surname}`;
  }

  /** Wiring της κάρτας παραπάνω — άνοιγμα modal με λίστα υποψήφιων
   * παραληπτών (fetch GET, ρητή απαίτηση χρήστη 20/08/2026: να επιλέγει ο
   * ίδιος σε ποιον θα σταλεί το καλωσόρισμα, ΚΑΙ στα δύο κουμπιά), επιλογή
   * μέσω checkboxes + «Επιλογή όλων», αποστολή ΜΟΝΟ στους επιλεγμένους μέσω
   * POST {employeeIds}/{emails}. No-op αν η κάρτα δεν υπάρχει στο DOM (δηλ.
   * δεν είσαι ο BULK_WELCOME_OWNER_EMAIL). */
  function wireBulkWelcomeButtons() {
    const bwTechBtn = document.getElementById('bw-tech-btn');
    const bwStaffBtn = document.getElementById('bw-staff-btn');
    if (!bwTechBtn || !bwStaffBtn) return;
    const bwMsg = document.getElementById('bw-msg');

    const openBulkWelcomeSelection = async ({ listUrl, modalId, listBoxId, selectAllId }) => {
      const listBox = document.getElementById(listBoxId);
      listBox.innerHTML = loadingBarHtml('Φόρτωση...');
      openModal(modalId);
      try {
        const res = await fetch(listUrl);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Σφάλμα.');
        const targets = data.targets || [];
        if (!targets.length) {
          listBox.innerHTML = '<p style="font-size:12.5px; color:var(--text-dim);">Κανένας υποψήφιος παραλήπτης.</p>';
          return;
        }
        listBox.innerHTML = targets.map((t, i) => `
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="checkbox" class="bw-item-cb" value="${i}">
            <span>${t.name || t.email}${t.team ? ` <span style="color:var(--text-dim);">(${t.team})</span>` : ''}${t.email && t.name ? ` <span style="color:var(--text-dim);">— ${t.email}</span>` : ''}</span>
          </label>
        `).join('');
        listBox.dataset.targets = JSON.stringify(targets);
        const selectAll = document.getElementById(selectAllId);
        selectAll.checked = false;
        selectAll.onchange = () => {
          listBox.querySelectorAll('.bw-item-cb').forEach(cb => { cb.checked = selectAll.checked; });
        };
      } catch (err) {
        listBox.innerHTML = `<p style="font-size:12.5px; color:var(--danger, #e5484d);">Σφάλμα: ${err.message || err}</p>`;
      }
    };

    const sendBulkWelcomeSelection = async ({ listBoxId, modalId, sendUrl, bodyKey, label }) => {
      const listBox = document.getElementById(listBoxId);
      const targets = JSON.parse(listBox.dataset.targets || '[]');
      const checked = Array.from(listBox.querySelectorAll('.bw-item-cb:checked')).map(cb => targets[Number(cb.value)]);
      if (!checked.length) { alert('Επίλεξε τουλάχιστον έναν παραλήπτη.'); return; }
      if (!confirm(`Θα σταλεί email σε ${checked.length} παραλήπτη(ες). Συνέχεια;`)) return;
      closeModal(modalId);
      bwTechBtn.disabled = true; bwStaffBtn.disabled = true;
      bwMsg.textContent = 'Αποστολή... μπορεί να πάρει λίγα λεπτά.'; bwMsg.className = 'msg';
      try {
        const body = {};
        body[bodyKey] = checked.map(t => bodyKey === 'employeeIds' ? t.employeeId : t.email);
        const res = await fetch(sendUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Σφάλμα.');
        const failedNames = (data.failed || []).map(f => f.name || f.email).join(', ');
        bwMsg.textContent = `${label}: στάλθηκαν ${data.sent}/${data.total}.${data.failed && data.failed.length ? ' Απέτυχαν: ' + failedNames : ''}`;
        bwMsg.className = 'msg ok';
      } catch (err) {
        bwMsg.textContent = 'Σφάλμα: ' + (err.message || err); bwMsg.className = 'msg err';
      } finally {
        bwTechBtn.disabled = false; bwStaffBtn.disabled = false;
      }
    };

    bwTechBtn.addEventListener('click', () => openBulkWelcomeSelection({
      listUrl: '/api/admin/bulk-welcome/technicians', modalId: 'bw-tech-modal',
      listBoxId: 'bw-tech-list', selectAllId: 'bw-tech-select-all',
    }));
    bwStaffBtn.addEventListener('click', () => openBulkWelcomeSelection({
      listUrl: '/api/admin/bulk-welcome/staff', modalId: 'bw-staff-modal',
      listBoxId: 'bw-staff-list', selectAllId: 'bw-staff-select-all',
    }));
    document.getElementById('bw-tech-confirm-btn').addEventListener('click', () => sendBulkWelcomeSelection({
      listBoxId: 'bw-tech-list', modalId: 'bw-tech-modal',
      sendUrl: '/api/admin/bulk-welcome/technicians', bodyKey: 'employeeIds', label: 'Τεχνικοί',
    }));
    document.getElementById('bw-staff-confirm-btn').addEventListener('click', () => sendBulkWelcomeSelection({
      listBoxId: 'bw-staff-list', modalId: 'bw-staff-modal',
      sendUrl: '/api/admin/bulk-welcome/staff', bodyKey: 'emails', label: 'Backoffice/TL/Director',
    }));
  }

  async function submitNewTechnician(info) {
    const name = document.getElementById('nt-name').value.trim();
    const employeeId = document.getElementById('nt-empid').value.trim();
    const email = document.getElementById('nt-email').value.trim();
    const annualDays = document.getElementById('nt-days').value;
    const teamSelectVal = document.getElementById('nt-team-select').value;
    const team = teamSelectVal === '__other__' ? document.getElementById('nt-team-other').value.trim() : teamSelectVal;
    const teamLeaderEmail = document.getElementById('nt-leader').value;
    const hasDrivingLicense = !!document.getElementById('nt-license').value;
    const ama = document.getElementById('nt-ama').value.trim();
    const amka = document.getElementById('nt-amka').value.trim();
    const afm = document.getElementById('nt-afm').value.trim();
    const fatherName = document.getElementById('nt-father-name').value.trim();
    const idNumber = document.getElementById('nt-id-number').value.trim();
    const phone = document.getElementById('nt-phone').value.trim();
    const companyPhone = document.getElementById('nt-company-phone').value.trim();
    const address = document.getElementById('nt-address').value.trim();
    const hireDate = document.getElementById('nt-hiredate').value;
    const technicalTraining = document.getElementById('nt-training').value.trim();
    const priorExperience = document.getElementById('nt-prior-experience').value.trim();
    const huskiesUsername = document.getElementById('nt-huskies-user').value.trim();
    const huskiesPassword = document.getElementById('nt-huskies-pass').value.trim();
    const docFiles = {
      cv: document.getElementById('nt-doc-cv').files[0] || null,
      id: document.getElementById('nt-doc-id').files[0] || null,
      residence: document.getElementById('nt-doc-residence').files[0] || null,
    };
    const msg = document.getElementById('nt-submit-msg');
    const btn = document.getElementById('nt-submit-btn');

    if (!name) { msg.textContent = 'Χρειάζεται ονοματεπώνυμο.'; msg.className = 'msg err'; return; }
    if (!employeeId) { msg.textContent = 'Χρειάζεται κωδικός υπαλλήλου.'; msg.className = 'msg err'; return; }
    if (!teamLeaderEmail) { msg.textContent = 'Επίλεξε Team Leader.'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/employees/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, employeeId, email, teamLeaderEmail, annualDays, team, hasDrivingLicense, ama, amka, afm, fatherName, idNumber, phone, companyPhone, address, hireDate, technicalTraining, priorExperience, huskiesUsername, huskiesPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία δημιουργίας.');

      // Συνημμένα (προαιρετικά) — ανεβαίνουν ΜΕΤΑ τη δημιουργία, χρειάζονται
      // ήδη υπαρκτό employeeId. Best-effort: αν αποτύχει κάποιο, ο τεχνικός
      // έχει ήδη δημιουργηθεί κανονικά — απλά ενημερώνουμε με προειδοποίηση.
      const docFailures = [];
      for (const [docType, file] of Object.entries(docFiles)) {
        if (!file) continue;
        try {
          const upRes = await fetch(`/api/employees/document/upload?employeeId=${encodeURIComponent(data.employee.EmployeeID)}&docType=${docType}&filename=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            headers: { 'Content-Type': file.type || 'application/octet-stream' },
            body: file,
          });
          const upData = await upRes.json();
          if (!upRes.ok) throw new Error(upData.error || 'Αποτυχία ανεβάσματος.');
        } catch (err) {
          docFailures.push(docType);
        }
      }

      msg.textContent = 'Ο τεχνικός δημιουργήθηκε.';
      msg.className = 'msg ok';
      btn.disabled = false;

      const resultEl = document.getElementById('nt-result');
      resultEl.style.display = '';
      resultEl.innerHTML = `
        <div class="section-title" style="margin-top:0;">Στοιχεία σύνδεσης</div>
        <p style="font-size:13px; color:var(--text-dim); margin-bottom:10px;">Σημείωσέ τα τώρα${email ? ' — στάλθηκαν και με email' : ''}· δεν θα ξαναφανούν εδώ.</p>
        <table>
          <tbody>
            <tr><td>Κωδικός υπαλλήλου</td><td><strong>${data.employee.EmployeeID}</strong></td></tr>
            <tr><td>PIN</td><td><strong style="font-size:16px; letter-spacing:2px;">${data.pin}</strong></td></tr>
          </tbody>
        </table>
        ${email && !data.emailSent ? '<p class="msg err" style="margin-top:10px;">Το email δεν στάλθηκε (δεν έχουν ρυθμιστεί ακόμα οι ειδοποιήσεις email στο portal) — πες του τα στοιχεία προσωπικά.</p>' : ''}
        ${(huskiesUsername || huskiesPassword) ? `<p class="msg" style="margin-top:10px;">Τα στοιχεία Huskies καταχωρήθηκαν${email && data.emailSent ? ' και στάλθηκαν μαζί με το email καλωσορίσματος' : ''}.</p>` : ''}
        ${docFailures.length ? `<p class="msg err" style="margin-top:10px;">Αποτυχία ανεβάσματος συνημμένου (${docFailures.join(', ')}) — ο τεχνικός δημιουργήθηκε κανονικά, δοκίμασε να ανεβάσεις ξανά το αρχείο αργότερα.</p>` : ''}
      `;
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  // ---- Dark/light διακόπτης θέματος (πρόταση Claude μετά από preview στο
  // Lovable, αποδεκτή από χρήστη, 18/08/2026) — καθαρά client-side, CSS
  // variables μέσω [data-theme] στο <html>, αποθήκευση σε localStorage. ----
  function applyThemeToggleUi(isDark) {
    document.getElementById('app-theme-icon').className = isDark ? 'ti ti-sun' : 'ti ti-moon';
    document.getElementById('app-theme-btn').title = isDark ? 'Φωτεινό θέμα' : 'Σκούρο θέμα';
  }
  applyThemeToggleUi(document.documentElement.getAttribute('data-theme') === 'dark');
  document.getElementById('app-theme-btn').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('optikitec-theme', 'light'); } catch (e) {}
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('optikitec-theme', 'dark'); } catch (e) {}
    }
    applyThemeToggleUi(!isDark);
  });

  // ---- Γενική μηχανή modal (πρόταση Claude μετά από preview στο Lovable,
  // αποδεκτή από χρήστη, 18/08/2026) — ένας delegated listener σε module
  // scope (καλείται μία φορά στη φόρτωση σελίδας) καλύπτει ΟΛΑ τα modals σε
  // ΟΛΑ τα tabs, ανεξάρτητα από το πότε/πόσες φορές ξαναγράφεται το
  // #content μέσω innerHTML — καμία ανάγκη re-wiring ανά render*(). ----
  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('show');
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('show');
  }
  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('[data-modal-open]');
    if (trigger) { openModal(trigger.dataset.modalOpen); return; }
    const closeBtn = e.target.closest('[data-modal-close]');
    if (closeBtn) { const ov = closeBtn.closest('.modal-overlay'); if (ov) ov.classList.remove('show'); return; }
    if (e.target.classList && e.target.classList.contains('modal-overlay')) {
      e.target.classList.remove('show');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.show').forEach(ov => ov.classList.remove('show'));
    }
  });

    } catch (err) {
