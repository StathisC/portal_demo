<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // Εφαρμογή αποθηκευμένου θέματος ΠΡΙΝ το πρώτο render, ώστε να μην
  // αναβοσβήνει η σελίδα στο λάθος θέμα κατά τη φόρτωση.
  (function () {
    try {
      var t = localStorage.getItem('optikitec-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<title>Demo Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
  :root{
    --navy:#0F1A2E; --navy-2:#16223A;
    --page:#F4F6F9; --card:#FFFFFF; --line:#E7EAF0; --field-bg:#FAFBFC;
    --text:#1B2333; --text-dim:#78808F; --text-faint:#A6ADBB;
    --accent:#2E9BFF; --accent-dark:#1B7FE0; --accent-bg:#E8F3FF; --accent-line:#BFDCFA;
    --green:#1FAE7A; --blue:#3E7BFA; --amber:#F0A93A; --red:#E5484D;
    --green-bg:#EAF8F2; --green-line:#CDEDDF;
    --shadow-1:0 1px 2px rgba(16,24,40,0.04); --shadow-2:0 8px 20px rgba(16,24,40,0.035);
    --card-line:rgba(231,234,240,0.7);
  }
  /* Dark theme (πρόταση Claude μετά από preview στο Lovable, αποδεκτή από
     χρήστη, 18/08/2026) — εναλλαγή μέσω [data-theme="dark"] στο <html>,
     αποθηκευμένη σε localStorage. Το sidebar παραμένει ίδιο (ήδη σκούρο
     navy) και στα δύο θέματα — αλλάζει μόνο η κύρια περιοχή περιεχομένου. */
  html[data-theme="dark"]{
    --page:#0B1220; --card:#131C2E; --line:#223050; --field-bg:#18233A;
    --text:#E7EAF0; --text-dim:#A9B3C7; --text-faint:#6B7690;
    --accent-bg:rgba(46,155,255,0.16); --accent-line:rgba(46,155,255,0.4);
    --green-bg:rgba(31,174,122,0.16); --green-line:rgba(31,174,122,0.4);
    --shadow-1:0 1px 2px rgba(0,0,0,0.35); --shadow-2:0 8px 20px rgba(0,0,0,0.28);
    --card-line:rgba(255,255,255,0.07);
  }
  /* Fix (18/08/2026, αναφέρθηκε από χρήστη μέσω screenshot — Σάββατο/
     Κυριακή στο ημερολόγιο έμεναν λευκά): αρκετά badge/chip/cell στοιχεία
     είχαν hardcoded pastel hex χρώματα (όχι CSS variables), άρα δεν
     άλλαζαν καθόλου με το [data-theme="dark"]. Ένα ενιαίο override block
     εδώ, χωρίς καμία αλλαγή στους κανόνες φωτεινού θέματος παραπάνω. */
  html[data-theme="dark"] .dash-tile-icon.tone-ok,
  html[data-theme="dark"] .status-pill.Εγκρίθηκε,
  html[data-theme="dark"] .status-pill.st-ok,
  html[data-theme="dark"] .btn-yes,
  html[data-theme="dark"] .cal-chip-approved,
  html[data-theme="dark"] .dash-tile .sub.tone-ok{color:#4FD8A5;}
  html[data-theme="dark"] .dash-tile-icon.tone-warn,
  html[data-theme="dark"] .status-pill.Εκκρεμεί,
  html[data-theme="dark"] .status-pill.st-warn,
  html[data-theme="dark"] .cal-chip-pending{background:rgba(240,169,58,0.16);}
  html[data-theme="dark"] .dash-tile-icon.tone-bad,
  html[data-theme="dark"] .status-pill.Απορρίφθηκε,
  html[data-theme="dark"] .status-pill.st-bad,
  html[data-theme="dark"] .btn-no{background:rgba(229,72,77,0.16);}
  html[data-theme="dark"] .cal-cell.cal-weekend,
  html[data-theme="dark"] .lic-badge.lic-no{background:rgba(255,255,255,0.04);}
  html[data-theme="dark"] .cal-chip-telework{background:rgba(46,155,255,0.18); color:#8FC7FF;}
  html[data-theme="dark"] .cal-chip-vehicle{background:rgba(154,86,220,0.22); color:#D7B4F7;}
  html[data-theme="dark"] .cal-chip-maintenance{background:rgba(192,57,43,0.22); color:#F1998C;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--page); align-items:flex-start; color:var(--text); font-family:'Inter',sans-serif; display:flex; min-height:100vh; font-size:14px;}

  .sidebar{width:230px; flex-shrink:0; background:var(--navy); height:100vh; position:sticky; top:0; padding:18px 14px; display:flex; flex-direction:column; overflow-y:auto;}
  .logo{display:flex; align-items:center; gap:10px; margin-bottom:22px; padding:0 2px;}
  .logo-badge{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; flex-shrink:0;}
  .logo-text-group{display:flex; flex-direction:column; line-height:1.2; min-width:0;}
  .logo-title{font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; color:#fff; white-space:nowrap;}
  .logo-sub{font-size:9px; font-weight:800; letter-spacing:0.14em; color:#8590A6; text-transform:uppercase;}

  .nav-group{margin-bottom:18px;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#A9B3C7; font-size:13.5px; font-weight:500; text-decoration:none; margin-bottom:3px; cursor:pointer; border:none; border-left:3px solid transparent; background:transparent; width:100%; text-align:left; font-family:'Inter',sans-serif;}
  .nav-item:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .nav-item.active{background:rgba(46,155,255,0.14); color:#fff; font-weight:600; border-left-color:var(--accent);}
  .nav-icon{font-size:16.5px; width:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; line-height:1; color:#8590A6; transition:color .15s ease;}
  .nav-item:hover .nav-icon{color:#fff;}
  .nav-item.active .nav-icon{color:var(--accent);}
  .nav-label{flex:1; min-width:0;}
  .nav-badge{flex-shrink:0; background:var(--red); color:#fff; font-size:11px; font-weight:800; line-height:1; padding:3px 6.5px; border-radius:100px; min-width:9px; text-align:center;}
  .nav-section-label{font-size:10.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:#93A0C4; padding:6px 11px; margin-top:10px;}
  .nav-section-label:not(:first-child){margin-top:28px;}
  .nav-gap{height:52px;}

  .sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:10px; border-top:1px solid #223050;}
  .sidebar-footer-row{display:flex; align-items:flex-start; gap:10px; min-width:0;}
  .sidebar-avatar{width:32px; height:32px; border-radius:50%; background:rgba(46,155,255,0.18); border:1.5px solid rgba(46,155,255,0.45); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#7CC0FF; flex-shrink:0; margin-top:1px;}
  .sidebar-footer-text{min-width:0; flex:1;}
  .sidebar-footer .name{font-size:12.5px; font-weight:600; color:#fff; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; word-break:break-word;}
  .sidebar-footer .role{font-size:11px; color:#8590A6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .logout-btn{align-self:flex-end; background:transparent; border:none; color:#8590A6; cursor:pointer; font-size:11px; font-family:'Inter',sans-serif; padding:0;}
  .logout-btn:hover{color:#fff;}
  .theme-toggle-btn{display:flex; align-items:center; gap:7px; width:100%; background:rgba(255,255,255,0.05); border:1px solid #223050; color:#A9B3C7; cursor:pointer; font-size:11.5px; font-weight:600; font-family:'Inter',sans-serif; padding:7px 10px; border-radius:7px; margin-top:2px;}
  .theme-toggle-btn:hover{background:rgba(255,255,255,0.09); color:#fff;}
  .theme-toggle-btn i{font-size:14px;}

  /* Global header (πόρτηση από το Lovable prototype, ρητό αίτημα χρήστη,
     18/08/2026) — μόνιμο, πάνω από το #content, ίδιο σε ΟΛΑ τα tabs. */
  .app-header{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; position:sticky; top:0; z-index:40; background:var(--page); margin:-28px -36px 22px; padding:20px 36px 18px; border-bottom:1px solid var(--line);}
  .app-header-greet h1{font-size:17px; font-weight:600;}
  .app-header-greet p{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .app-header-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .app-search{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px; min-width:230px;}
  .app-search i{color:var(--text-faint); font-size:15px; flex-shrink:0;}
  .app-search input{border:none; outline:none; background:transparent; font-size:12.5px; font-family:'Inter',sans-serif; color:var(--text); width:100%;}
  .app-search input::placeholder{color:var(--text-faint);}
  .app-icon-btn{position:relative; width:38px; height:38px; border-radius:9px; background:var(--card); border:1px solid var(--line); color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0; font-family:'Inter',sans-serif;}
  .app-icon-btn:hover{color:var(--text); border-color:var(--accent-line);}
  .app-notif-dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid var(--card);}
  .app-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent-bg); border:1.5px solid var(--accent-line); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
  @media (max-width:760px){ .app-search{display:none;} }

  /* Γενικό modal component (πρόταση Claude μετά από preview στο Lovable,
     αποδεκτή από χρήστη, 18/08/2026) — αντικαθιστά μόνιμα ανοιχτές φόρμες
     προσθήκης με on-demand pop-up, ίδιο σε όλα τα σημεία που το χρησιμοποιούν. */
  .modal-overlay{position:fixed; inset:0; background:rgba(11,18,32,0.55); display:none; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:1000; overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--card); border-radius:14px; max-width:680px; width:100%; padding:24px; position:relative; box-shadow:0 24px 64px rgba(0,0,0,0.35); margin:auto 0;}
  .modal-box-wide{max-width:900px;}
  .modal-close{position:absolute; top:12px; right:14px; background:transparent; border:none; color:var(--text-faint); font-size:22px; line-height:1; cursor:pointer; padding:4px; font-family:'Inter',sans-serif;}
  .modal-close:hover{color:var(--text);}
  .modal-title{font-size:15.5px; font-weight:700; margin-bottom:16px; padding-right:26px;}
  .modal-box .card{box-shadow:none; border:none; padding:0; margin-bottom:0;}

  main{flex:1; padding:28px 36px; max-width:100%;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; flex-wrap:wrap; gap:14px; padding-bottom:18px; border-bottom:1px solid var(--line);}
  .topbar-main{display:flex; align-items:flex-start; gap:13px; min-width:0;}
  .topbar-icon{width:40px; height:40px; border-radius:10px; background:var(--accent-bg); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .topbar h1{font-size:21px; font-weight:600;}
  .topbar p{font-size:13px; color:var(--text-dim); margin-top:2px;}
  .topbar-side{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .topbar-date{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); font-weight:600; text-transform:capitalize; padding:9px 13px; background:var(--card); border:1px solid var(--line); border-radius:9px; white-space:nowrap;}
  .topbar-date i{color:var(--accent); font-size:14px;}
  .role-badge{align-self:flex-start; background:var(--accent-bg); color:var(--accent-dark); font-size:12px; font-weight:700; padding:9px 16px; border-radius:9px; border:1px solid var(--accent-line); white-space:nowrap;}
  .topbar-right{flex-shrink:0;}

  .section-title{font-size:14px; font-weight:600; margin-bottom:12px; margin-top:22px;}
  .section-title:first-of-type{margin-top:0;}
  .card-title{font-size:16px; font-weight:700; margin-bottom:16px;}
  .tp-identity-head{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .tp-section{margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--line);}
  .tp-section:last-of-type{margin-bottom:0; padding-bottom:0; border-bottom:none;}
  .tp-section-label{display:flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:0.04em; color:var(--text-faint); text-transform:uppercase; font-weight:600; margin-bottom:12px;}
  .tp-section-label i{font-size:13px;}
  .tp-field-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px 20px;}
  .tp-field-list{display:flex; flex-direction:column; gap:12px;}
  .tp-field-label{font-size:11px; color:var(--text-faint); margin-bottom:2px;}
  .tp-field-value{font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tp-section-training{font-size:12.5px; color:var(--text-dim); line-height:1.7;}
  .tp-section-training ul{margin:0; padding-left:18px;}
  .tp-section-columns{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--line);}
  .tp-section-col{padding:0 20px;}
  .tp-section-col:first-child{padding-left:0;}
  .tp-section-col:last-child{padding-right:0;}
  .tp-section-col:not(:first-child){border-left:1px solid var(--line);}
  @media (max-width:640px){
    .tp-section-columns{grid-template-columns:1fr; border-bottom:none; padding-bottom:0; margin-bottom:0;}
    .tp-section-col{padding:0 0 20px; border-left:none; border-bottom:1px solid var(--line); margin-bottom:20px;}
    .tp-section-col:last-child{padding-bottom:0; border-bottom:none; margin-bottom:20px;}
  }

  .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:8px;}
  .metrics.cols-4{grid-template-columns:repeat(4,1fr);}
  .metric{background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow-1), var(--shadow-2);}
  .metric .label{font-size:10.5px; letter-spacing:0.04em; color:var(--text-faint); text-transform:uppercase; font-weight:600; margin-bottom:8px;}
  .metric .num{font-size:24px; font-weight:700;}
  .leave-balance-bar{margin:2px 0 18px;}
  .leave-balance-bar .lb-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .leave-balance-bar .lb-track{background:var(--line); border-radius:100px; height:9px; overflow:hidden;}
  .leave-balance-bar .lb-fill{height:100%; border-radius:100px; transition:width .3s ease;}

  .dash-greeting h1{font-size:23px; font-weight:700;}
  .dash-greeting p{font-size:13px; color:var(--text-dim); margin-top:4px;}
  .dash-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px; margin-bottom:28px;}
  .dash-tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; cursor:pointer; text-align:left; font-family:'Inter',sans-serif; color:var(--text); display:flex; flex-direction:column; gap:16px; transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;}
  .dash-tile:hover{box-shadow:0 10px 26px rgba(20,30,50,0.09); transform:translateY(-2px); border-color:var(--accent-line);}
  .dash-tile-top{display:flex; align-items:center; justify-content:space-between;}
  .dash-tile-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .dash-tile-icon.tone-accent{background:var(--accent-bg); color:var(--accent-dark);}
  .dash-tile-icon.tone-ok{background:var(--green-bg); color:#0C7A50;}
  .dash-tile-icon.tone-warn{background:#FFF4E5; color:var(--amber);}
  .dash-tile-icon.tone-bad{background:#FDECEC; color:var(--red);}
  .dash-tile-arrow{color:var(--text-faint); font-size:14px;}
  .dash-tile .num{font-size:30px; font-weight:800; line-height:1;}
  .dash-tile .label{font-size:12.5px; font-weight:600; color:var(--text-dim); margin-top:6px;}
  .dash-tile .sub{font-size:11.5px; margin-top:3px; font-weight:600;}
  .dash-tile .sub.tone-ok{color:#0C7A50;}
  .dash-tile .sub.tone-warn{color:var(--amber);}
  .dash-tile .sub.tone-bad{color:var(--red);}
  .dash-tile .sub.tone-accent{color:var(--text-faint); font-weight:500;}

  .card{background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow-1), var(--shadow-2);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em;}
  .field select, .field input, .field textarea{
    padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:'Inter',sans-serif; color:var(--text); background:var(--field-bg);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field select:focus, .field input:focus, .field textarea:focus{outline:none; border-color:var(--accent); background:var(--card);}
  .field-value{padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:'Inter',sans-serif; color:var(--text); background:var(--field-bg);}
  /* Πεδία στον πίνακα «Νέο έγγραφο» (tab Έγγραφα) — δεν είναι μέσα σε .field
     wrapper, άρα δεν κληρονομούσαν κανένα στυλ (εμφανίζονταν λευκά, χωρίς
     θέμα, βλ. fix 05/09/2026). Ίδιο στυλ με .field input, standalone. */
  .doc-field-input{width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:'Inter',sans-serif; color:var(--text); background:var(--field-bg);}
  .doc-field-input:focus{outline:none; border-color:var(--accent); background:var(--card);}
  html[data-theme="dark"] .doc-field-input::-webkit-calendar-picker-indicator{filter:invert(1);}

  .btn{border:none; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff; box-shadow:0 6px 16px rgba(46,155,255,0.22);}
  .btn-primary:disabled{opacity:0.55; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line); padding:6px 12px; font-size:12px;}
  .btn-approve{background:var(--green); color:#fff; padding:7px 14px; font-size:12px;}
  .btn-reject{background:transparent; color:var(--red); border:1px solid var(--red); padding:7px 14px; font-size:12px;}
  .btn-leave-approve{background:var(--accent); color:#fff; padding:7px 14px; font-size:12px; display:inline-flex; align-items:center; gap:6px;}
  .btn-leave-approve:hover{background:var(--accent-dark);}
  .btn-leave-reject{background:transparent; color:var(--text-dim); border:1px solid var(--line); padding:7px 14px; font-size:12px; display:inline-flex; align-items:center; gap:6px;}
  .btn-leave-reject:hover{color:var(--text); border-color:var(--accent-line);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  .form-actions{display:flex; align-items:center; gap:12px;}
  .msg{font-size:12.5px;}
  .msg.ok{color:var(--green);}
  .msg.err{color:var(--red);}

  /* Animated indeterminate loading bar — αντικαθιστά το απλό κείμενο
     "Φόρτωση..." όπου έχει νόημα οπτικά (π.χ. Προφίλ Τεχνικού, 25/08/2026,
     ρητό αίτημα χρήστη). Indeterminate γιατί δεν ξέρουμε πραγματικό ποσοστό
     προόδου ενός fetch — μπάρα σταθερού πλάτους που γλιστράει, ίδιο μοτίβο
     με πολλά web apps (π.χ. YouTube top bar). */
  .loading-bar-wrap{margin:16px auto 0; max-width:320px;}
  .loading-bar-track{position:relative; width:100%; height:6px; background:var(--line); border-radius:100px; overflow:hidden;}
  .loading-bar-fill{position:absolute; top:0; height:100%; width:35%; background:var(--accent); border-radius:100px; animation:loadingBarMove 1.15s ease-in-out infinite;}
  .loading-bar-label{font-size:12px; color:var(--text-dim); margin-top:8px; text-align:center;}
  @keyframes loadingBarMove{
    0%{ left:-35%; }
    100%{ left:100%; }
  }

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600; overflow-wrap:anywhere;}
  /* overflow-wrap:anywhere — ασφάλεια σε ΟΛΟΥΣ τους πίνακες του portal (25/08→03/09/2026,
     fix «στήλες πέφτουν η μια πάνω στην άλλη»): με table-layout:fixed, περιεχόμενο χωρίς φυσικά
     σημεία αναδίπλωσης (π.χ. αριθμός χιλιομέτρων, μακρύ όνομα/κωδικός) υπερχειλίζει οπτικά έξω
     από το κελί αντί να αναδιπλωθεί — ανεξάρτητα από το πόσο σωστά υπολογίζονται τα πλάτη
     στηλών. Το anywhere αναγκάζει αναδίπλωση ΚΑΙ μέσα σε "λέξεις" όταν δεν χωράει αλλιώς.*/
  td{padding:10px; border-bottom:1px solid var(--line); overflow-wrap:anywhere;}
  tr:last-child td{border-bottom:none;}
  /* border-radius 100px→7px + white-space:nowrap (fix 03/09/2026): με πλήρες
     pill σχήμα + overflow-wrap:anywhere, ένα δίγραμμο κείμενο (π.χ. «Διαθέσιμο»
     σε στενή στήλη) σπάει σε 2 γραμμές αλλά το pill δεν έχει αρκετό ύψος/
     line-height για δύο γραμμές — οι γραμμές πέφτουν οπτικά η μια πάνω στην
     άλλη. Τώρα το badge ΔΕΝ σπάει ποτέ (nowrap) — απλά χρειάζεται αρκετά
     φαρδιά στήλη (βλ. rebalance colgroup ανά πίνακα). */
  /* overflow:hidden + text-overflow:ellipsis (03/09/2026) — χωρίς αυτό, ένα badge με
     μεγάλο κείμενο (π.χ. μακρύς κωδικός e-pass) σε στενή στήλη υπερχειλίζει ΕΞΩ από
     το δικό του td (το white-space:nowrap παραπάνω δεν το εμποδίζει, μόνο αποτρέπει
     να σπάσει σε 2 γραμμές) και επικαλύπτεται οπτικά με το badge της διπλανής
     στήλης — βλ. bug «e-pass/Κατάσταση επικαλύπτονται» στο Στόλο. */
  .status-pill{padding:3px 10px; border-radius:7px; font-size:11px; font-weight:700; display:inline-block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom;}
  .status-pill.Εκκρεμεί{background:#FFF4E5; color:var(--amber);}
  .status-pill.Εγκρίθηκε{background:var(--green-bg); color:#0C7A50;}
  .status-pill.Απορρίφθηκε{background:#FDECEC; color:var(--red);}
  .status-pill.st-ok{background:var(--green-bg); color:#0C7A50;}
  .status-pill.st-warn{background:#FFF4E5; color:var(--amber);}
  .status-pill.st-bad{background:#FDECEC; color:var(--red);}
  .status-pill.st-info{background:var(--accent-bg); color:var(--accent-dark);}
  .cell-muted{color:var(--text-faint);}
  td.fl-edit input, td.fl-edit select{padding:6px 8px; border-radius:6px; border:1px solid var(--line); font-size:12.5px; font-family:'Inter',sans-serif; width:100%; color:var(--text); background:var(--field-bg);}
  td.fl-edit input:focus, td.fl-edit select:focus{outline:none; border-color:var(--accent); background:var(--card);}
  html[data-theme="dark"] td.fl-edit input::-webkit-calendar-picker-indicator{filter:invert(1);}
  table.fl-table{table-layout:fixed; min-width:820px;}
  /* min-width (03/09/2026, ίδιο fix): αντί οι στήλες να στριμώχνονται σε
     οποιοδήποτε πλάτος κάρτας, ο πίνακας κρατάει ελάχιστο ρεαλιστικό πλάτος —
     αν η κάρτα είναι στενότερη, κάνει οριζόντιο scroll (βλ. .card:has() παρακάτω)
     αντί να συμπιέζει τις στήλες μέχρι να γίνουν αδιάβαστες/να υπερχειλίζουν. */
  .card:has(table.fl-table){overflow-x:auto; -webkit-overflow-scrolling:touch;}
  /* ΟΧΙ white-space:nowrap πια (fix 03/09/2026, «στήλες πέφτουν η μια πάνω στην
     άλλη») — με nowrap, τα 2 κουμπιά Επεξεργασία/Διαγραφή δεν χωρούσαν ποτέ σε
     στενή στήλη Ενεργειών και υπερχείλιζαν προς τα αριστερά, πάνω στις διπλανές
     στήλες. Τώρα αναδιπλώνονται σε 2η γραμμή αν δεν χωράνε, ποτέ δεν υπερχειλίζουν. */
  td.fl-actions{text-align:right;}
  th.ta-right, td.ta-right{text-align:right;}
  td.fl-actions .icon-btn{margin-left:6px; margin-top:4px; display:inline-block;}
  td.ta-center, th.ta-center{text-align:center;}
  .icon-btn{background:transparent; border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:12px; cursor:pointer; color:var(--text-dim);}
  .icon-btn:hover{color:var(--text);}
  .icon-btn.danger:hover{color:var(--red); border-color:var(--red);}
  /* Εικονίδιο-μόνο παραλλαγή (χωρίς κείμενο) — Ενέργειες στους πίνακες Στόλος/Εξοπλισμός/e-pass
     (03/09/2026), ώστε να ελευθερωθεί χώρος πλάτους στη στήλη Ενέργειες. Ξεχωριστή κλάση
     αντί για αλλαγή του γενικού .icon-btn, ώστε να ΜΗΝ επηρεαστούν τα υπόλοιπα icon-btn με
     κείμενο αλλού στο portal (π.χ. "Προβολή/Εκτύπωση", "Καταγραφή παραλαβής"). */
  .icon-btn-sq, td.fl-actions .icon-btn-sq{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; padding:0; font-size:14px;}

  /* Στόλος Οχημάτων — redesign σε κάρτες (04/09/2026, preview πριν την
     υλοποίηση, βασισμένο σε σχεδιαστική κατεύθυνση ανεβασμένου Dyad app,
     προσαρμοσμένο στα πραγματικά πεδία/vars του portal) — αντικαθιστά τον
     πίνακα table.fl-table ΜΟΝΟ για το tab Στόλος (Εξοπλισμός/e-pass
     παραμένουν πίνακες, δεν ζητήθηκε αλλαγή εκεί). */
  /* auto-fill (ΟΧΙ auto-fit) + minmax(300px, 1fr) — ρητές απαιτήσεις χρήστη
     (05/09/2026, δύο διαδοχικά αιτήματα): το `auto-fill` από μόνο του λύνει
     ήδη το πρόβλημα "τεντώνεται με λίγα αποτελέσματα" (σε αντίθεση με το
     `auto-fit`, δεν καταρρέουν τα κενά tracks — ένα μοναχικό αποτέλεσμα
     παίρνει μόνο το δικό του track, όχι όλη τη σειρά) — το προηγούμενο
     πέρασμα είχε ΕΠΙΠΛΕΟΝ κόψει και το άνω όριο σε σταθερό 340px, που όμως
     άφηνε κενό περιθώριο δεξιά όταν τα οχήματα ήταν αρκετά για να γεμίσουν
     πλήρεις σειρές (βλ. screenshot χρήστη, 25 οχήματα). Με `1fr` οι κάρτες
     απλώνονται να καλύψουν όλο το πλάτος της κάρτας «Οχήματα» όταν υπάρχουν
     αρκετά αποτελέσματα ανά σειρά, ΧΩΡΙΣ να επηρεάζεται η συμπεριφορά με
     λίγα αποτελέσματα (αυτή εξαρτάται αποκλειστικά από το auto-fill). */
  .fleet-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;}
  .fleet-card{background:var(--card); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; transition:border-color .15s ease, box-shadow .15s ease;}
  .fleet-card:hover{border-color:var(--accent-line); box-shadow:var(--shadow-2);}
  .fleet-card-body{padding:16px;}
  .fleet-card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .fleet-plate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .fleet-plate{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; letter-spacing:0.03em; background:var(--field-bg); border:1px solid var(--line); border-radius:7px; padding:3px 9px; color:var(--text);}
  .fleet-card-model{font-size:13px; font-weight:600; margin-top:8px; color:var(--text);}
  .fleet-card-type{font-size:11.5px; color:var(--text-dim); display:block; margin-top:2px;}
  .fleet-card-icon{width:36px; height:36px; border-radius:10px; background:var(--field-bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:17px; flex-shrink:0;}
  .fleet-info-box{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--field-bg); border:1px solid var(--card-line);}
  .fleet-info-row{display:flex; align-items:flex-start; gap:8px;}
  .fleet-info-row i{font-size:14px; color:var(--accent); margin-top:2px; flex-shrink:0;}
  .fleet-info-label{font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); display:block;}
  .fleet-info-value{font-size:12px; font-weight:600; color:var(--text);}
  .fleet-info-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--text-dim); flex-wrap:wrap;}
  .fleet-dates-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
  .fleet-date-item{display:flex; flex-direction:column; gap:4px; min-width:0;}
  /* ΚΤΕΟ/Service ΧΩΡΙΣ badge/pill φόντο μέσα στην κάρτα οχήματος (05/09/2026,
     ρητή απαίτηση χρήστη, ΑΝΑΘΕΩΡΕΙ το προηγούμενο "λιγότερο έντονο badge"
     πέρασμα ίδιας μέρας) — απλό κείμενο, "φωτίζεται" (χρωματίζεται) ΜΟΝΟ όταν
     απομένουν <=5 ημέρες ή έχει ήδη λήξει (fleetDateInline(), ανεξάρτητο
     κατώφλι από το γενικό fleetDateAlertLevel()/30 ημέρες που παραμένει
     αμετάβλητο για το tile Αρχικής/nav badge). ΟΧΙ αλλαγή του γενικού
     .status-pill st-ok/st-warn/st-bad, που παραμένει αμετάβλητο σε όλο το
     υπόλοιπο portal (Άδειες/Εξοπλισμός/e-pass/e-pass badge δίπλα του). */
  .fleet-date-item .fleet-date-plain{font-size:12.5px; font-weight:600; color:var(--text);}
  .fleet-date-item .fleet-date-plain.fleet-date-warn{color:var(--amber); font-weight:700;}
  .fleet-date-item .fleet-date-plain.fleet-date-bad{color:var(--red); font-weight:700;}
  .fleet-meta-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:10px; font-size:11.5px; color:var(--text-dim); overflow-wrap:anywhere;}
  .fleet-mileage-box{margin-top:12px; padding:11px 12px; border-radius:10px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .fleet-mileage-label{font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:#8590A6; display:block;}
  .fleet-mileage-value{font-family:'Manrope',sans-serif; font-weight:800; font-size:18px;}
  .fleet-mileage-unit{font-size:11px; font-weight:600; color:#8FC7FF; margin-left:4px;}
  .fleet-card-footer{padding:9px 16px; background:var(--field-bg); border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  /* "Σε συνεργείο από... · X ημέρες" (04/09/2026, ρητή απαίτηση χρήστη) — ίδιο
     χρωματικό μοτίβο με .status-pill.st-warn, αλλά ΧΩΡΙΣ nowrap/ellipsis
     (πλήρης πρόταση, όχι σύντομο badge). */
  .fleet-service-flag{margin-top:10px; padding:6px 10px; border-radius:8px; background:#FFF4E5; color:var(--amber); font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .fleet-service-flag i{font-size:13px;}
  html[data-theme="dark"] .fleet-service-flag{background:rgba(240,169,58,0.16);}

  /* 4 συνοπτικές κάρτες πάνω από τη λίστα οχημάτων (05/09/2026, ρητή απαίτηση
     χρήστη, βάσει mockup) — καθαρά client-side υπολογισμός πάνω στα ήδη
     φορτωμένα data.vehicles, καμία νέα κλήση backend. */
  .fleet-stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:16px;}
  .fleet-stat-card{background:var(--card); border:1px solid var(--card-line); border-radius:14px; padding:16px; box-shadow:var(--shadow-1), var(--shadow-2);}
  .fleet-stat-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .fleet-stat-title{font-size:10.5px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim); display:flex; align-items:center;}
  .fleet-stat-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .fleet-stat-value{font-family:'Manrope',sans-serif; font-weight:800; font-size:24px; color:var(--text); margin-top:10px;}
  .fleet-stat-unit{font-family:'Inter',sans-serif; font-weight:700; font-size:12px; color:var(--text-dim); margin-left:2px;}
  .fleet-stat-sub{margin-top:8px; font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px;}
  .fleet-stat-sub i{font-size:12px;}
  .fleet-stat-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .dot-blue{background:var(--accent);}
  .dot-green{background:var(--green);}
  .dot-red{background:var(--red);}
  .fleet-stat-blue{border-color:var(--accent-line);}
  .fleet-stat-blue .fleet-stat-icon{background:var(--accent-bg); color:var(--accent);}
  .fleet-stat-green{border-color:var(--green-line);}
  .fleet-stat-green .fleet-stat-icon{background:var(--green-bg); color:#0C7A50;}
  .fleet-stat-red{border-color:rgba(229,72,77,0.35);}
  .fleet-stat-red .fleet-stat-title{color:var(--red);}
  .fleet-stat-red .fleet-stat-value{color:var(--red);}
  .fleet-stat-red .fleet-stat-icon{background:#FDECEC; color:var(--red);}
  html[data-theme="dark"] .fleet-stat-red .fleet-stat-icon{background:rgba(229,72,77,0.16);}
  .fleet-stat-neutral .fleet-stat-icon{background:var(--field-bg); color:var(--text-dim); border:1px solid var(--line);}

  .empty{color:var(--text-dim); font-size:13px; padding:10px 0;}

  .an-item{padding:14px 0; border-bottom:1px solid var(--line);}
  .an-item:last-child{border-bottom:none;}
  .an-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .an-item-title{font-weight:700; font-size:14px;}
  .an-item-meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .an-item-body{font-size:13px; color:var(--text-dim); margin-top:8px; white-space:pre-wrap;}
  .an-item-file{display:inline-block; margin-top:8px; font-size:12.5px; color:var(--accent); text-decoration:none;}
  .an-item-file:hover{text-decoration:underline;}

  .avq-teams{display:flex; flex-wrap:wrap; gap:8px 16px;}
  .avq-team-opt{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); cursor:pointer;}
  .avq-team-opt input{cursor:pointer;}
  .avq-answer-btns{display:flex; gap:8px; margin-top:10px;}
  .avq-answer-btns .btn{padding:7px 16px; font-size:12.5px;}
  .btn-yes{background:var(--green-bg); color:#0C7A50;}
  .btn-no{background:#FDECEC; color:var(--red);}
  .btn-yes.active, .btn-no.active{box-shadow:inset 0 0 0 2px currentColor;}
  .avq-counts{display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--text-dim);}
  .avq-counts b{color:var(--text);}
  .avq-names{font-size:12px; color:var(--text-dim); margin-top:4px; cursor:pointer;}
  .avq-names summary{cursor:pointer;}

  .loading, .err{padding:40px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* ---- Ημερολόγιο αδειών ---- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-title{font-weight:700; font-size:14px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow-row{margin-bottom:6px;}
  .cal-dow{font-size:10.5px; font-weight:600; color:var(--text-faint); text-transform:uppercase; text-align:center; letter-spacing:0.03em;}
  .cal-cell{min-height:64px; border:1px solid var(--line); border-radius:8px; padding:6px; background:var(--field-bg); display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .cal-cell.cal-empty{border:none; background:transparent;}
  .cal-cell.cal-weekend{background:#F0F2F6;}
  .cal-cell.cal-today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-daynum{font-size:11px; font-weight:600; color:var(--text-dim); margin-bottom:2px;}
  .cal-chip{font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal-chip-approved{background:var(--green-bg); color:#0C7A50;}
  .cal-chip-pending{background:#FFF4E5; color:var(--amber);}
  .cal-chip-telework{background:#E6F1FB; color:#0C447C;}
  .cal-chip-vehicle{background:#F2E7FE; color:#6A1B9A;}
  .cal-chip-maintenance{background:#FDECEA; color:#C0392B;}
  .cal-legend{display:flex; gap:16px; margin-top:12px; font-size:12px; color:var(--text-dim); flex-wrap:wrap;}
  .cal-legend-item{display:flex; align-items:center; gap:6px;}
  .cal-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .cal-dot-approved{background:#1FAE7A;}
  .cal-dot-pending{background:#F0A93A;}
  .cal-dot-telework{background:#2E9BFF;}
  .cal-dot-vehicle{background:#8E44AD;}
  .cal-dot-maintenance{background:#C0392B;}

  /* ---- Συνεργεία (drag & drop) ---- */
  .crew-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .crew-toolbar select{padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:'Inter',sans-serif; color:var(--text); background:var(--field-bg);}
  .crew-toolbar .spacer{flex:1;}
  .history-banner{background:var(--accent-bg); border:1px solid var(--accent-line); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:12.5px; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .crew-layout{display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start;}
  .crew-pool{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-height:120px;}
  .crew-pool-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-faint); margin-bottom:10px;}
  .crew-pool-list{display:flex; flex-direction:column; gap:8px; min-height:60px;}
  .crew-pool-group{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .crew-pool-group:last-child{margin-bottom:0;}
  .crew-pool-group-title{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-faint); margin-top:2px;}
  .crew-board{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; align-content:start;}
  .crew-col{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:140px; display:flex; flex-direction:column;}
  .crew-col-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:10px;}
  .crew-col-head input{border:none; background:transparent; font-size:13.5px; font-weight:700; color:var(--text); padding:2px 4px; border-radius:6px; width:100%; font-family:'Inter',sans-serif;}
  .crew-col-head input:focus{outline:none; background:var(--accent-bg);}
  .crew-col-body{flex:1; display:flex; flex-direction:column; gap:7px; min-height:50px;}
  .crew-col.drag-over, .crew-pool-list.drag-over{background:var(--accent-bg); outline:2px dashed var(--accent-line); outline-offset:-4px; border-radius:8px;}
  .tech-card{background:var(--field-bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:grab; font-size:12.5px;}
  .tech-card:active{cursor:grabbing;}
  .tech-card.dragging{opacity:0.4;}
  .tech-card .tc-name{font-weight:600; margin-bottom:4px;}
  .tech-card .tc-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

      window.location.href = '/index.html';
      return;
    }

    const isTechnician = who.role === 'technician';
    const displayName = isTechnician ? who.name : (who.name || who.email);
    const roleLabel = isTechnician
      ? 'Τεχνικός'
      : who.staffRole === 'leader' ? 'Team Leader'
      : who.staffRole === 'backoffice' ? 'Backoffice'
      : who.staffRole === 'director' ? 'Director'

    document.getElementById('user-role').textContent = roleLabel;

    const nameParts = (displayName || '').trim().split(/\s+/).filter(Boolean);
    const firstNameOnly = nameParts.length ? nameParts[nameParts.length - 1] : '';

    document.getElementById('app-greeting').textContent = `Καλώς ήρθες${firstNameOnly ? ', ' + firstNameOnly : ''}`;

      ? TOOLS.technician
      : who.staffRole === 'leader' ? TOOLS.leader
      : who.staffRole === 'director' ? TOOLS.director
      : TOOLS.backoffice;
    const nav = document.getElementById('nav-tools');
    let lastSection = null;
    nav.innerHTML = tools.map((t, i) => {
      let label = '';
      if (t.gapBefore) {
        label = '<div class="nav-gap"></div>';
      } else if (t.section && t.section !== lastSection) {
        label = `<div class="nav-section-label">${SECTION_LABELS[t.section] || t.section}</div>`;
        lastSection = t.section;
      }
      return `${label}<button class="nav-item${i === 0 ? ' active' : ''}" data-key="${t.key}"><span class="nav-icon"><i class="ti ti-${NAV_ICON_MAP[t.key] || 'point'}"></i></span><span class="nav-label">${t.name}</span><span class="nav-badge" data-badge-key="${t.key}" style="display:none;"></span></button>`;
    }).join('');

    openTool(tools[0], roleLabel);

    nav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = tools.find(t => t.key === btn.dataset.key);
        if (tool.external) { window.open(tool.external, '_blank'); return; }
        nav.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        openTool(tool, roleLabel);
      });
    });

   * μένει ενημερωμένο χωρίς reload.
   */
  function setNavBadge(key, count) {
    const el = document.querySelector(`.nav-badge[data-badge-key="${key}"]`);
    if (el) {
      if (count > 0) {
        el.textContent = count > 99 ? '99+' : String(count);
        el.style.display = '';
      } else {
        el.style.display = 'none';

  function escapeHtml(v) {

  function fmtDate(d) {
    if (!d) return '';
    // Περνάει πρώτα από normalizeDateStr() — βλ. σχόλιο εκεί (bug garbled
    // ημερομηνιών, 24/08/2026: bare Sheets serial αριθμοί όπως "46267"
    // παρερμηνεύονταν από το new Date() σαν έτος 46267).
    const iso = normalizeDateStr(d);
    const dt = new Date(iso || d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  /**
   * Fix bug: «όταν περνάω μια άδεια δεν εμφανίζεται στο ημερολόγιο» (24/08/2026).
   * Ρίζα του προβλήματος: το Google Sheets API επιστρέφει τιμές ημερομηνίας με
   * FORMATTED_VALUE (προεπιλογή, δεν έχουμε ζητήσει UNFORMATTED_VALUE στο
   * sheets.js) — μια στήλη StartDate/EndDate που γράφτηκε ως "2026-08-24"
   * (USER_ENTERED input) το Sheets συχνά την αναγνωρίζει σαν πραγματική
   * ημερομηνία και την επιστρέφει πίσω μορφοποιημένη ανά locale (π.χ.
   * "24/8/2026" σε ελληνικά, ΟΧΙ "2026-08-24"). Το `fmtDate()` παραπάνω δεν
   * το πρόσεχε ποτέ γιατί το `new Date(d)` το parse-άρει σωστά ό,τι μορφή κι
   * αν πάρει — αλλά τα δύο ημερολόγια (mountLeaveCalendar/mountTechCalendar
   * παρακάτω) συγκρίνουν τα StartDate/EndDate σαν raw strings («2026-08-24»
   * <= dateStr) για να βρουν σε ποιο κελί ανήκει μια άδεια — μια συμβολοσειρά
   * "24/8/2026" ΔΕΝ συγκρίνεται ποτέ σωστά έτσι, οπότε η άδεια απλά δεν
   * εμφανιζόταν ΠΟΤΕ, ανεξάρτητα από μήνα/τεχνικό (ίδιο σύμπτωμα ανεξαρτήτου
   * TL/τεχνικού ημερολογίου). Αυτό κανονικοποιεί οποιαδήποτε από τις δύο
   * μορφές (ISO ή D/M/YYYY) σε ένα σταθερό "YYYY-MM-DD" πριν τη σύγκριση.
   */
  // Bug garbled ημερομηνιών εντοπίστηκε 24/08/2026 (π.χ. "01/01/46267" στον
  // πίνακα «Αιτήσεις άδειας» ΚΑΙ σε emails απόφασης τηλεργασίας): το backend
  // (readSheetAsObjects, χωρίς valueRenderOption -> Sheets API v4 default
  // FORMATTED_VALUE) επιστρέφει bare Google Sheets σειριακό αριθμό ημέρας
  // (π.χ. "46267") για κελιά που δεν είχαν μορφοποίηση ημερομηνίας τη στιγμή
  // της πρώτης εγγραφής — το `new Date("46267")` το παρερμηνεύει σαν έτος
  // 46267/Ιανουάριος/1ο. Το backend τώρα κανονικοποιεί στην πηγή (βλ.
  // src/dateutil.js) τα περισσότερα σημεία, αλλά αυτή η συνάρτηση παραμένει
  // ως δεύτερη γραμμή άμυνας client-side (ίδια λογική, defense in depth).
  function normalizeDateStr(v) {
    if (!v) return '';
    const s = String(v).trim();
    // Ήδη ISO-shaped — επιβεβαίωση ότι το μεσαίο group είναι όντως έγκυρος
    // μήνας πριν το εμπιστευτούμε ως YYYY-MM-DD. Δεύτερο, ξεχωριστό bug
    // εντοπίστηκε 24/08/2026: μερικά κελιά τηλεργασίας είχαν custom
    // μορφοποίηση "yyyy-dd-mm" (π.χ. "2026-16-09" αντί για "2026-09-16"),
    // οπότε ένα τυφλό `s.slice(0,10)` εδώ κρατούσε τη λάθος σειρά.
    const isoLike = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (isoLike) {
      const [, y, a, b] = isoLike;
      const an = Number(a), bn = Number(b);
      if (an >= 1 && an <= 12) return `${y}-${a}-${b}`;
      if (bn >= 1 && bn <= 12) return `${y}-${b}-${a}`; // yyyy-dd-mm -> swap
      return `${y}-${a}-${b}`;
    }
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      const [, d, mo, y] = m;
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    // Bare Google Sheets σειριακός αριθμός ημέρας (ημέρες από 30/12/1899) —
    // εύρος ~1968-2130 ώστε να μην παρερμηνευτεί τυχαίος άσχετος αριθμός.
    if (/^\d{4,6}$/.test(s)) {
      const serial = Number(s);
      if (serial >= 25000 && serial <= 95000) {
        const ms = Date.UTC(1899, 11, 30) + serial * 86400000;
        const sd = new Date(ms);
        if (!isNaN(sd)) {
          return `${sd.getUTCFullYear()}-${String(sd.getUTCMonth() + 1).padStart(2, '0')}-${String(sd.getUTCDate()).padStart(2, '0')}`;
        }
      }
    }
    const dt = new Date(s);
    if (!isNaN(dt)) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    return s;
  }

  /**
   * Γενικό βοηθητικό εξαγωγής πίνακα σε CSV (client-side, χωρίς εξωτερική
   * βιβλιοθήκη — item #120, 15/08/2026) — reused από Στόλο/Εξοπλισμό/
   * Ιστορικό Ενεργειών. UTF-8 BOM (`﻿`) ώστε τα ελληνικά να ανοίγουν
   * σωστά στο Excel (χωρίς BOM το Excel υποθέτει λάθος encoding). `rows`:
   * array από arrays, ήδη μορφοποιημένες τιμές (strings/numbers).
   */
  function exportTableToCsv(filename, headers, rows) {
    const escape = (v) => {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\r\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [headers.map(escape).join(','), ...rows.map(r => r.map(escape).join(','))];
    const csv = String.fromCharCode(0xFEFF) + lines.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /**
   * Γενικό βοηθητικό εξαγωγής πίνακα σε PDF μέσω browser print (item #122,
   * 15/08/2026) — ίδιο μοτίβο (window.open + window.print(), χωρίς
   * εξωτερική βιβλιοθήκη) με τα υπόλοιπα PDF exports του portal (Δελτίο
   * Παράδοσης/Παραλαβής, ιστορικό αδειών τεχνικού). Reused από τα ίδια 3
   * σημεία με το exportTableToCsv.
   */
  function exportTableToPdf(title, headers, rows) {
    const win = window.open('', '_blank');
    if (!win) { alert('Ο browser μπλόκαρε το άνοιγμα του παραθύρου εκτύπωσης — επίτρεψε pop-ups για αυτή τη σελίδα.'); return; }

    const escapeHtml = (v) => {
      const s = v === null || v === undefined ? '' : String(v);
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    const theadHtml = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
    const rowsHtml = rows.map(r => `<tr>${r.map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('');
    const today = new Date().toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' });

    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(title)}</title>
      <style>
        body{font-family:Arial,Helvetica,sans-serif; padding:28px; color:#1B2333;}
        h1{font-size:17px; margin:0 0 4px;}
        p{font-size:12px; color:#555; margin:0 0 18px;}
        table{width:100%; border-collapse:collapse; font-size:11px;}
        th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
        th{background:#f4f6f9;}
      </style></head><body>
      <h1>${escapeHtml(title)}</h1>
      <p>${rows.length} εγγραφές · ${today} · Demo Portal</p>
      <table><thead><tr>${theadHtml}</tr></thead><tbody>${rowsHtml || `<tr><td colspan="${headers.length}">Καμία εγγραφή</td></tr>`}</tbody></table>
      </body></html>`);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }

  function fmtDateTime(d) {
    if (!d) return '';
    const dt = new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
      dt.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
  }

  // ============================================================
  // Real-time υπολογισμός εργάσιμων ημερών (εξαιρεί Σ/Κ + ελληνικές
  // επίσημες αργίες) — ίδια λογική με το src/leaves.js στο backend,
  // ώστε η προεπισκόπηση να ταιριάζει ακριβώς με ό,τι θα καταχωρηθεί.
  // ============================================================
  function orthodoxEasterGregorian(year) {
    const a = year % 4, b = year % 7, c = year % 19;
    const d = (19 * c + 15) % 30;
    const e = (2 * a + 4 * b - d + 34) % 7;
    const month = Math.floor((d + e + 114) / 31);
    const day = ((d + e + 114) % 31) + 1;
    const julian = new Date(Date.UTC(year, month - 1, day));
    julian.setUTCDate(julian.getUTCDate() + 13);
    return julian;
  }

  function greekHolidaySet(year) {
    const easter = orthodoxEasterGregorian(year);
    const set = new Set();
    const add = (dt) => set.add(dt.toISOString().slice(0, 10));
    add(new Date(Date.UTC(year, 0, 1)));
    add(new Date(Date.UTC(year, 0, 6)));
    const cleanMonday = new Date(easter); cleanMonday.setUTCDate(easter.getUTCDate() - 48);
    add(cleanMonday);
    add(new Date(Date.UTC(year, 2, 25)));
    const easterMonday = new Date(easter); easterMonday.setUTCDate(easter.getUTCDate() + 1);
    add(easterMonday);
    add(new Date(Date.UTC(year, 4, 1)));
    const holySpirit = new Date(easter); holySpirit.setUTCDate(easter.getUTCDate() + 50);
    add(holySpirit);
    add(new Date(Date.UTC(year, 7, 15)));
    add(new Date(Date.UTC(year, 9, 28)));
    add(new Date(Date.UTC(year, 11, 25)));
    add(new Date(Date.UTC(year, 11, 26)));
    return set;
  }

  function countWorkDays(startStr, endStr) {
    if (!startStr || !endStr) return null;
    const start = new Date(startStr + 'T00:00:00Z');
    const end = new Date(endStr + 'T00:00:00Z');
    if (isNaN(start) || isNaN(end) || end < start) return null;
    const holidayCache = {};
    let count = 0;
    const cur = new Date(start);
    while (cur <= end) {
      const year = cur.getUTCFullYear();
      if (!holidayCache[year]) holidayCache[year] = greekHolidaySet(year);
      const dow = cur.getUTCDay();
      const iso = cur.toISOString().slice(0, 10);
      if (dow !== 0 && dow !== 6 && !holidayCache[year].has(iso)) count++;
      cur.setUTCDate(cur.getUTCDate() + 1);
    }
    return count;
  }

  function wireDaysPreview(startId, endId, previewId) {
    const update = () => {
      const start = document.getElementById(startId).value;
      const end = document.getElementById(endId).value;
      const el = document.getElementById(previewId);
      const days = countWorkDays(start, end);
      if (days === null) { el.textContent = '–'; return; }
      el.textContent = days + (days === 1 ? ' εργάσιμη ημέρα' : ' εργάσιμες ημέρες');
    };
    document.getElementById(startId).addEventListener('change', update);
    document.getElementById(endId).addEventListener('change', update);
  }

  // Εμφανίζει/κρύβει το προαιρετικό πεδίο "Δικαιολογητικό" μέσα στις φόρμες
  // υποβολής (Νέα αίτηση άδειας / Καταχώρηση άδειας για τεχνικό) ανάλογα με
  // τον επιλεγμένο τύπο — ΕΓΙΝΕ 03/09/2026, ρητή απαίτηση χρήστη: πριν
  // μπορούσε να ανέβει δικαιολογητικό ΜΟΝΟ μετά την υποβολή (από το
  // ιστορικό/τον πίνακα αιτήσεων), τώρα προαιρετικά και τη στιγμή της ίδιας
  // της υποβολής, για κάθε χρήστη που υποβάλλει (τεχνικός/TL/Backoffice/
  // Director στο δικό του «Οι Άδειές μου») ΚΑΙ όταν ο TL καταχωρεί εκ
  // μέρους τεχνικού. Reused και στα δύο σημεία — ίδια λογική εμφάνισης.
  function wireSickAttachmentToggle(typeSelectId, fieldId) {
    const select = document.getElementById(typeSelectId);
    const field = document.getElementById(fieldId);
    if (!select || !field) return;
    const update = () => { field.style.display = select.value === LEAVE_SICK_TYPE ? '' : 'none'; };
    select.addEventListener('change', update);
    update();
  }

  // Ανέβασμα δικαιολογητικού αμέσως μετά από επιτυχή υποβολή αίτησης — καμία
  // δική του alert()/re-render (σε αντίθεση με uploadLeaveFile/
  // uploadTeamLeaveFile, που ενεργοποιούνται από ξεχωριστό κουμπί σε ήδη
  // υποβληθείσα αίτηση) — ο καλών αποφασίζει πώς θα δείξει το αποτέλεσμα.
  async function uploadAttachmentSilently(requestId, file) {
    const res = await fetch(`/api/leaves/attachment/upload?requestId=${encodeURIComponent(requestId)}&filename=${encodeURIComponent(file.name)}`, {
      method: 'POST',
      headers: { 'Content-Type': file.type },
      body: file,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Αποτυχία ανεβάσματος δικαιολογητικού.');
    return data;
  }

  function renderMyLeavesHistory(history, tool, roleLabel) {
    const tbody = document.getElementById('ml-history');
    if (!history || !history.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Καμία αίτηση ακόμα</td></tr>';
      return;
    }
    tbody.innerHTML = history.map(l => `
      <tr>
        <td>${fmtDate(l.StartDate)} – ${fmtDate(l.EndDate)}</td>
        <td>${l.Type}</td>
        <td>${l.Days}</td>
        <td><span class="status-pill ${l.Status}">${l.Status}</span></td>
        <td>${renderAttachmentCell(l)}</td>
      </tr>
    `).join('');

    tbody.querySelectorAll('button[data-upload-id]').forEach(btn => {
      btn.addEventListener('click', () => triggerLeaveUpload(btn.dataset.uploadId, tool, roleLabel));
    });
  }

  function renderAttachmentCell(l) {
    if (l.Type !== LEAVE_SICK_TYPE) return '<span style="color:var(--text-dim);">—</span>';
    if (l.FileKey) {
      return `<a href="/api/leaves/attachment?id=${encodeURIComponent(l.ID)}" target="_blank" rel="noopener">📄 Προβολή</a>`;
    }
    return `<button class="btn btn-ghost" data-upload-id="${l.ID}" style="padding:4px 9px; font-size:12px;">Ανέβασμα PDF</button>`;
  }

  function triggerLeaveUpload(requestId, tool, roleLabel) {
    const input = document.getElementById('ml-file-input');
    input.value = '';
    input.onchange = () => {
      if (input.files && input.files[0]) uploadLeaveFile(requestId, input.files[0], tool, roleLabel);
    };
    input.click();
  }

  async function uploadLeaveFile(requestId, file, tool, roleLabel) {
    if (file.type !== 'application/pdf') {
      alert('Επιτρέπεται μόνο αρχείο PDF.');
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      alert('Το αρχείο είναι πολύ μεγάλο (μέγιστο 20MB).');
      return;
    }
    try {
      const res = await fetch(`/api/leaves/attachment/upload?requestId=${encodeURIComponent(requestId)}&filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': file.type },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία ανεβάσματος.');
      renderMyLeaves(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
    }
  }

  async function submitMyLeave(tool, roleLabel) {
    const startDate = document.getElementById('ml-start').value;
    const endDate = document.getElementById('ml-end').value;
    const type = document.getElementById('ml-type').value;
    const note = document.getElementById('ml-note').value;
    const attachInput = document.getElementById('ml-attach-input');
    const attachFile = (type === LEAVE_SICK_TYPE && attachInput && attachInput.files && attachInput.files[0]) || null;
    const msg = document.getElementById('ml-msg');
    const btn = document.getElementById('ml-submit-btn');

    if (!startDate || !endDate) { msg.textContent = 'Συμπλήρωσε ημερομηνίες.'; msg.className = 'msg err'; return; }
    if (attachFile && attachFile.type !== 'application/pdf') { msg.textContent = 'Το δικαιολογητικό πρέπει να είναι αρχείο PDF.'; msg.className = 'msg err'; return; }
    if (attachFile && attachFile.size > 20 * 1024 * 1024) { msg.textContent = 'Το δικαιολογητικό είναι πολύ μεγάλο (μέγιστο 20MB).'; msg.className = 'msg err'; return; }

    btn.disabled = true;
    msg.textContent = 'Αποστολή...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/leaves/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, startDate, endDate, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία υποβολής.');
      let text = `Υποβλήθηκε (${data.days} ημέρες) — στάλθηκε στον team leader.`;
      if (attachFile) {
        try {
          await uploadAttachmentSilently(data.requestId, attachFile);
          text += ' Το δικαιολογητικό ανέβηκε.';
        } catch (uploadErr) {
          text += ' Η αίτηση υποβλήθηκε, αλλά το δικαιολογητικό απέτυχε να ανέβει — δοκίμασε ξανά από το ιστορικό αιτήσεων.';
        }
      }
      msg.textContent = text;
      msg.className = 'msg ok';
      btn.disabled = false;
      renderMyLeaves(tool, roleLabel);
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  // ============================================================
  // ΑΔΕΙΕΣ ΟΜΑΔΑΣ (TL — έγκριση/απόρριψη + καταχώρηση εκ μέρους)
  // ============================================================

  async function renderTeamLeaves(tool, roleLabel) {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.innerHTML = loadingBarHtml('Φόρτωση...');

    let data;
    try {
      const res = await fetch('/api/leaves/team');
      data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Σφάλμα φόρτωσης.');
    } catch (err) {
      content.className = 'err';
      content.textContent = 'Σφάλμα: ' + (err.message || err);

    content.className = '';
    const totalDays = data.daysPerEmployee.reduce((s, e) => s + e.days, 0);
    const teamLeavesDesc = `${data.pendingCount} εκκρεμείς αιτήσεις από ${data.team.length} τεχνικούς.`;

    content.innerHTML = `

      <div class="metrics">
        <div class="metric"><div class="label">Εκκρεμείς αιτήσεις</div><div class="num">${data.pendingCount}</div></div>

              ? `Έχεις δηλώσει ότι λείπεις${data.myBackupName ? ` — σε αντικαθιστά ο/η <strong>${data.myBackupName}</strong>, που βλέπει τώρα την ομάδα σου και μπορεί να εγκρίνει αιτήσεις` : ''}.`

      </div>

      ${CURRENT_WHO.staffRole === 'director' ? `
      <div class="card" style="border-color:var(--accent);">
        <div class="card-title">Μαζική άδεια (όλοι οι υπάλληλοι)</div>
        <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:14px;">Καταχωρεί ΕΓΚΕΚΡΙΜΕΝΗ άδεια ταυτόχρονα σε ΟΛΟΥΣ τους ενεργούς υπαλλήλους (τεχνικούς, Team Leaders, Backoffice, Directors) — π.χ. εταιρικές διακοπές. Ο καθένας ενημερώνεται με email, όσοι δεν έχουν αρκετό υπόλοιπο εξαιρούνται αυτόματα (θα εμφανιστούν ως αποτυχίες παρακάτω). Ορατό μόνο σε Director.</p>
        <div class="form-grid">
          <div class="field">
            <label>Ημερομηνία έναρξης</label>
            <input type="date" id="bl-start">
          </div>
          <div class="field">
            <label>Ημερομηνία λήξης</label>
            <input type="date" id="bl-end">
          </div>
          <div class="field">
            <label>Τύπος άδειας</label>
            <select id="bl-type">
              <option>Κανονική άδεια</option>
              <option>Αναρρωτική</option>
              <option>Άδεια χωρίς αποδοχές</option>
              <option>Αδικαιολογήτως Απών</option>
              <option>Λοιπές</option>
            </select>
          </div>
          <div class="field full">
            <label>Σημείωση (προαιρετικό)</label>
            <textarea id="bl-note" placeholder="π.χ. διακοπή λειτουργίας εταιρείας..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="bl-submit-btn">Καταχώρηση σε όλους</button>
          <span class="msg" id="bl-msg"></span>
        </div>
      </div>
      ` : ''}

      <div class="card">
        <div class="card-title">Ημερολόγιο αδειών</div>
        <div id="tl-calendar"></div>
      </div>

      <div class="card">
        <div class="card-title">Αιτήσεις άδειας</div>
        <table>
          <thead><tr><th>Τεχνικός</th><th>Τύπος</th><th>Ημερομηνίες</th><th>Κατάσταση</th><th></th></tr></thead>
          <tbody id="tl-requests"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">Καταχώρηση άδειας για τεχνικό</div>
        <div class="form-grid">
          <div class="field full">
            <label>Τεχνικός</label>
            <select id="tl-employee">
              <option value="">— Επίλεξε τεχνικό της ομάδας σου —</option>
              ${data.team.map(t => `<option value="${t.EmployeeID}">${t.Name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Ημερομηνία έναρξης</label>
            <input type="date" id="tl-start">
          </div>
          <div class="field">
            <label>Ημερομηνία λήξης</label>
            <input type="date" id="tl-end">
          </div>
          <div class="field">
            <label>Τύπος άδειας</label>
            <select id="tl-type">
              <option>Κανονική άδεια</option>
              <option>Αναρρωτική</option>
              <option>Άδεια χωρίς αποδοχές</option>
              <option>Αδικαιολογήτως Απών</option>
              <option>Λοιπές</option>
            </select>
          </div>
          <div class="field">
            <label>Εργάσιμες ημέρες</label>
            <div id="tl-days-preview" style="padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--field-bg); font-weight:700; font-size:13.5px;">–</div>
          </div>
          <div class="field full">
            <label>Σημείωση (προαιρετικό)</label>
            <textarea id="tl-note" placeholder="π.χ. οικογενειακός λόγος..."></textarea>
          </div>
          <div class="field full" id="tl-attach-field" style="display:none;">
            <label>Δικαιολογητικό (PDF, προαιρετικό)</label>
            <input type="file" id="tl-attach-input" accept="application/pdf">
          </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="tl-submit-btn">Καταχώρηση αίτησης</button>

      <div class="card">
        <div class="card-title">Αναζήτηση αδειών τεχνικού</div>

          <div class="field full">

            <select id="tls-employee">
              <option value="">— Επίλεξε τεχνικό —</option>
              ${data.team.map(t => `<option value="${t.EmployeeID}">${t.Name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Από</label>
            <input type="date" id="tls-start">
          </div>
          <div class="field">
            <label>Έως</label>
            <input type="date" id="tls-end">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="tls-search-btn">Αναζήτηση</button>
          <button class="btn btn-ghost" id="tls-pdf-btn" style="display:none;">Εξαγωγή PDF</button>
          <span class="msg" id="tls-msg"></span>
        </div>
        <div id="tls-results" style="margin-top:14px;"></div>
      </div>
      <input type="file" id="tl-file-input" accept="application/pdf" style="display:none;">

    renderLeaveRequestsTable(data.pending, data.decided, tool, roleLabel);
    mountLeaveCalendar(document.getElementById('tl-calendar'), data.calendarLeaves || []);

    document.getElementById('tl-submit-btn').addEventListener('click', () => submitTeamLeave(tool, roleLabel));
    wireDaysPreview('tl-start', 'tl-end', 'tl-days-preview');
    wireSickAttachmentToggle('tl-type', 'tl-attach-field');
    document.getElementById('tls-search-btn').addEventListener('click', () => searchTechnicianLeaves(data.team));
    document.getElementById('tls-pdf-btn').addEventListener('click', exportTechnicianLeavesPdf);

    if (data.isAway) {
      document.getElementById('tl-away-toggle').addEventListener('click', () => toggleLeaderAway(false, null, tool, roleLabel));
    } else {
      document.getElementById('tl-away-start').addEventListener('click', () => showBackupPicker(data.otherLeaders, tool, roleLabel));
    }

    if (CURRENT_WHO.staffRole === 'director') {
      document.getElementById('bl-submit-btn').addEventListener('click', submitBulkLeaveUi);
    }
  }

  // Μαζική άδεια σε όλους τους ενεργούς υπαλλήλους — αυστηρά Director,
  // βλ. κάρτα «Μαζική άδεια» στο renderTeamLeaves() παραπάνω.
  async function submitBulkLeaveUi() {
    const startDate = document.getElementById('bl-start').value;
    const endDate = document.getElementById('bl-end').value;
    const type = document.getElementById('bl-type').value;
    const note = document.getElementById('bl-note').value;
    const msg = document.getElementById('bl-msg');
    const btn = document.getElementById('bl-submit-btn');

    if (!startDate || !endDate) { msg.textContent = 'Συμπλήρωσε ημερομηνίες.'; msg.className = 'msg err'; return; }
    if (!confirm(`Σίγουρα θέλεις να καταχωρήσεις "${type}" από ${startDate} έως ${endDate} σε ΟΛΟΥΣ τους ενεργούς υπαλλήλους; Η ενέργεια δεν αναιρείται μαζικά (χρειάζεται ξεχωριστή διαγραφή ανά αίτηση αν χρειαστεί).`)) return;

    btn.disabled = true;
    msg.textContent = 'Καταχώρηση σε εξέλιξη...'; msg.className = 'msg';

    try {
      const res = await fetch('/api/admin/bulk-leave', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, startDate, endDate, note }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία καταχώρησης.');
      let text = `Ολοκληρώθηκε: ${data.success}/${data.total} επιτυχείς.`;
      if (data.failed && data.failed.length) {
        text += ' Απέτυχαν: ' + data.failed.map(f => `${f.name} (${f.reason})`).join(' · ');
      }
      msg.textContent = text;
      msg.className = 'msg ' + (data.failed && data.failed.length ? 'err' : 'ok');
      btn.disabled = false;
    } catch (err) {
      msg.textContent = 'Σφάλμα: ' + (err.message || err);
      msg.className = 'msg err';
      btn.disabled = false;
    }
  }

  // Αντί για fixed backup ανά TL, ο TL επιλέγει τη στιγμή που δηλώνει "Λείπω"
  // ποιος άλλος team leader θα τον αντικαταστήσει (dropdown, όχι προρύθμιση).
  function showBackupPicker(otherLeaders, tool, roleLabel) {
    const actions = document.getElementById('tl-away-actions');
    if (!otherLeaders || !otherLeaders.length) {
      alert('Δεν βρέθηκαν άλλοι Team Leaders για επιλογή αντικαταστάτη.');
      return;
    }
    actions.innerHTML = `
      <select id="tl-backup-select" style="padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:12.5px; font-family:'Inter',sans-serif;">
        <option value="">— Ποιος σε αντικαθιστά; —</option>
        ${otherLeaders.map(l => `<option value="${l.Email}">${l.Name}</option>`).join('')}
      </select>
      <button class="btn btn-approve" id="tl-backup-confirm" style="margin-left:8px;">Επιβεβαίωση</button>
      <button class="btn btn-ghost" id="tl-backup-cancel" style="margin-left:6px;">Άκυρο</button>
    `;
    document.getElementById('tl-backup-confirm').addEventListener('click', () => {
      const backupEmail = document.getElementById('tl-backup-select').value;
      if (!backupEmail) { alert('Επίλεξε ποιος θα σε αντικαταστήσει.'); return; }
      toggleLeaderAway(true, backupEmail, tool, roleLabel);
    });
    document.getElementById('tl-backup-cancel').addEventListener('click', () => renderTeamLeaves(tool, roleLabel));
  }

  async function toggleLeaderAway(away, backupEmail, tool, roleLabel) {
    try {
      const res = await fetch('/api/leaves/team', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ away, backupEmail }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία ενημέρωσης.');
      renderTeamLeaves(tool, roleLabel);
    } catch (err) {
      alert('Σφάλμα: ' + (err.message || err));
      renderTeamLeaves(tool, roleLabel);
    }
  }

  // ---- Αναζήτηση αδειών τεχνικού + export PDF (browser print, χωρίς εξωτερικές βιβλιοθήκες) ----
  let TLS_LAST_RESULTS = { employeeName: '', startDate: '', endDate: '', rows: [] };

  async function searchTechnicianLeaves(team) {
    const employeeId = document.getElementById('tls-employee').value;
    const startDate = document.getElementById('tls-start').value;
    const endDate = document.getElementById('tls-end').value;
    const msg = document.getElementById('tls-msg');
    const resultsEl = document.getElementById('tls-results');
    const pdfBtn = document.getElementById('tls-pdf-btn');

    if (!employeeId) { msg.textContent = 'Επίλεξε τεχνικό.'; msg.className = 'msg err'; return; }

    msg.textContent = 'Αναζήτηση...'; msg.className = 'msg';
    pdfBtn.style.display = 'none';

    try {
      const qs = new URLSearchParams({ employeeId });
      if (startDate) qs.set('startDate', startDate);
      if (endDate) qs.set('endDate', endDate);
      const res = await fetch('/api/leaves/team?' + qs.toString());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Αποτυχία αναζήτησης.');

      // Ρητή απαίτηση χρήστη (02/09/2026): η «Αναζήτηση αδειών τεχνικού»
      // δείχνει ΜΟΝΟ άδειες, ΟΧΙ τηλεργασία — φιλτράρεται εδώ, client-side,
      // πριν από την εμφάνιση ΚΑΙ πριν αποθηκευτεί για το PDF export (ώστε
      // να συμφωνούν πλήρως τα δύο). Ο πίνακας «Αιτήσεις άδειας» παραπάνω
      // στο ίδιο tab ΔΕΝ αγγίζεται — εκεί η τηλεργασία παραμένει (ρητή
      // επιβεβαίωση χρήστη, χρειάζεται να είναι εγκρίσιμη μέσα από το portal).
      const results = data.results.filter(r => r.Type !== 'Τηλεργασία');

      msg.textContent = `${results.length} αποτελέσματα.`;
      msg.className = 'msg';

      const employeeName = (team.find(t => t.EmployeeID === employeeId) || {}).Name || (results[0] || {}).EmployeeName || '';
      TLS_LAST_RESULTS = { employeeName, startDate, endDate, rows: results };

      resultsEl.innerHTML = `
        <table>
          <thead><tr><th>Περίοδος</th><th>Τύπος</th><th>Ημέρες</th><th>Κατάσταση</th><th>Σημείωση</th><th></th></tr></thead>
          <tbody>${results.length ? results.map(r => `
            <tr>
              <td>${fmtDate(r.StartDate)} – ${fmtDate(r.EndDate)}</td>
              <td>${r.Type}</td>
              <td>${r.Days}</td>

  // Μηνιαία οπτική εικόνα αδειών ομάδας — ποιος λείπει πότε, ώστε να μη
  // συμπίπτουν άδειες στο ίδιο συνεργείο. Καθαρά client-side (δεδομένα ήδη
  // φορτωμένα από /api/leaves/team), η πλοήγηση μήνα δεν κάνει νέο fetch.
  function mountLeaveCalendar(container, leaves) {
    const pad = (n) => String(n).padStart(2, '0');
    const MONTH_NAMES = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
    const DOW = ['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'];

    const cursor = new Date();
    cursor.setDate(1);

    function leavesOnDay(dateStr) {
      return leaves.filter(l => {
        const s = normalizeDateStr(l.StartDate);
        const e = normalizeDateStr(l.EndDate);
        return s && e && s <= dateStr && e >= dateStr;
      });
    }

    function render() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7; // 0 = Δευτέρα
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell cal-empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
        const dow = new Date(year, month, day).getDay();
        const isWeekend = dow === 0 || dow === 6;
        // Σαββατοκύριακο = μη εργάσιμη ημέρα ούτως ή άλλως — μην εμφανίζεις
        // τον τεχνικό ως "σε άδεια" εκεί, θα μπέρδευε τον σχεδιασμό
        // συνεργείων (ο σκοπός του ημερολογίου, βλ. σχόλιο συνάρτησης).
        const dayLeaves = isWeekend ? [] : leavesOnDay(dateStr);
        cells += `
          <div class="cal-cell${isWeekend ? ' cal-weekend' : ''}${dateStr === todayStr ? ' cal-today' : ''}">
            <div class="cal-daynum">${day}</div>
            ${dayLeaves.map(l => `<div class="cal-chip ${l.Type === 'Τηλεργασία' ? 'cal-chip-telework' : (l.Status === 'Εκκρεμεί' ? 'cal-chip-pending' : 'cal-chip-approved')}" title="${l.EmployeeName} · ${l.Type} (${l.Status})">${(l.EmployeeName || '').split(' ')[0]}</div>`).join('')}
          </div>`;
      }

      container.innerHTML = `
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev" aria-label="Προηγούμενος μήνας">‹</button>
          <div class="cal-title">${MONTH_NAMES[month]} ${year}</div>
          <button class="icon-btn" id="cal-next" aria-label="Επόμενος μήνας">›</button>
        </div>
        <div class="cal-grid cal-dow-row">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend">
          <span class="cal-legend-item"><span class="cal-dot cal-dot-approved"></span> Εγκεκριμένη</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-pending"></span> Εκκρεμής</span>
          <span class="cal-legend-item"><span class="cal-dot cal-dot-telework"></span> Τηλεργασία</span>
        </div>
      `;

      container.querySelector('#cal-prev').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() - 1); render(); });
      container.querySelector('#cal-next').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() + 1); render(); });
    }

    render();
  }

  // ============================================================
  // ΗΜΕΡΟΛΟΓΙΟ ΤΕΧΝΙΚΟΥ (item #9, 15/08/2026) — ΜΟΝΟ στο δικό του tab (ρητή
  // απόφαση χρήστη). Άδειες/τηλεργασία + παραλαβή/επιστροφή/ΚΤΕΟ/Service
  // οχήματος σε ένα μηνιαίο ημερολόγιο, ίδιο grid component με το
  // mountLeaveCalendar της ομάδας (TL) αλλά γενικευμένο για πολλαπλούς
  // τύπους γεγονότων σε μία γραμμή (εδώ δεν χρειάζεται όνομα τεχνικού στο
  // chip, είναι το δικό του ημερολόγιο).
  // ============================================================

  const TECH_CAL_EVENT_META = {
    leave: { icon: '🗓️' },
    telework: { icon: '🏠', chipClass: 'cal-chip-telework' },
    pickup: { icon: '🚗', chipClass: 'cal-chip-vehicle' },
    return: { icon: '🔁', chipClass: 'cal-chip-vehicle' },
    kteo: { icon: '🔧', chipClass: 'cal-chip-maintenance' },
    service: { icon: '🛠️', chipClass: 'cal-chip-maintenance' },
  };

  function techCalChipClass(ev) {
    const meta = TECH_CAL_EVENT_META[ev.type] || {};
    if (meta.chipClass) return meta.chipClass;
    // Άδειες: χρώμα ανάλογα με την κατάσταση (ίδιο μοτίβο με mountLeaveCalendar)
    return ev.status === 'Εκκρεμεί' ? 'cal-chip-pending' : 'cal-chip-approved';
  }

  function techCalChipLabel(ev) {
    const meta = TECH_CAL_EVENT_META[ev.type] || {};
    return `${meta.icon || ''} ${ev.title}`.trim();
  }

  async function renderTechCalendar(tool, roleLabel) {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.innerHTML = loadingBarHtml('Φόρτωση...');

    let data;
    try {

      if (!res.ok) throw new Error(data.error || 'Σφάλμα φόρτωσης.');
    } catch (err) {
      content.className = 'err';
      content.textContent = 'Σφάλμα: ' + (err.message || err);
      return;

    content.className = '';
    content.innerHTML = `
      ${topbar(tool, roleLabel)}
      <div class="card" id="tc-calendar"></div>
    `;

    mountTechCalendar(document.getElementById('tc-calendar'), data.events || []);
